<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我们的恋爱手账</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one narrow column like a pocket notebook — counter card on top, tabs, then a dated timeline; floating "+" for new entries. */
:root{
  --bg:#f7f3f5;          /* blush paper */
  --surface:#ffffff;
  --ink:#2a2130;         /* plum ink */
  --muted:#7a6d80;
  --line:#e7dde3;
  --rose:#d9465c;        /* accent */
  --rose-soft:#fbe4e8;
  --sage:#5f8b72;        /* done / calm */
  --sage-soft:#e2efe7;
  --shadow:0 1px 2px rgba(42,33,48,.06),0 8px 24px rgba(42,33,48,.06);
  --f-display:"ZCOOL XiaoWei","Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"Fraunces",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b161e;--surface:#251f29;--ink:#f1e9ef;--muted:#a898a8;--line:#3a3140;
    --rose:#f06b80;--rose-soft:#3d2430;--sage:#85b598;--sage-soft:#22332a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b161e;--surface:#251f29;--ink:#f1e9ef;--muted:#a898a8;--line:#3a3140;
  --rose:#f06b80;--rose-soft:#3d2430;--sage:#85b598;--sage-soft:#22332a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.65 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(110px + env(safe-area-inset-bottom,0px));}
img{max-width:100%;display:block}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* ---------- counter ---------- */
.hero{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:22px 20px 18px;position:relative;overflow:hidden}
.couple{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--f-display);font-size:22px;text-wrap:balance}
.couple .heart{color:var(--rose);font-size:18px;animation:beat 2.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.18)}24%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.couple .heart{animation:none}}
.days{text-align:center;margin-top:6px}
.days .lbl{font-size:13px;color:var(--muted);letter-spacing:.12em}
.days .num{font-family:var(--f-num);font-style:italic;font-weight:600;font-size:clamp(56px,17vw,84px);line-height:1.05;color:var(--rose);font-variant-numeric:tabular-nums}
.days .unit{font-family:var(--f-display);font-size:20px;margin-left:4px}
.breakdown{text-align:center;color:var(--muted);font-size:13px}
.next{margin-top:14px;display:flex;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--rose-soft);color:var(--rose);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500}
.hero-actions{position:absolute;top:10px;right:10px;display:flex;gap:4px}
.icon-btn{border:0;background:transparent;color:var(--muted);width:34px;height:34px;border-radius:10px;cursor:pointer;display:grid;place-items:center}
.icon-btn:hover{background:var(--bg);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}

/* ---------- tabs ---------- */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-radius:14px;padding:4px;box-shadow:var(--shadow)}
.tab{border:0;background:transparent;padding:9px 0;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab .count{font-family:var(--f-num);font-size:12px;opacity:.7;margin-left:4px}

/* ---------- timeline ---------- */
.month{font-family:var(--f-display);font-size:17px;color:var(--muted);margin:6px 0 -6px 4px}
.list{display:flex;flex-direction:column;gap:12px}
.memory{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;text-align:left;border:0;padding:0;width:100%}
.memory .photo{width:100%;max-height:300px;object-fit:cover}
.memory .body{padding:14px 16px 14px 76px;position:relative;min-width:0}
.stamp{position:absolute;left:14px;top:14px;width:48px;text-align:center;border:1.5px solid var(--rose);color:var(--rose);border-radius:10px;padding:3px 0 2px;line-height:1.1}
.stamp .d{font-family:var(--f-num);font-size:22px;font-weight:600}
.stamp .w{font-size:10px;letter-spacing:.08em}
.memory h3{margin:0;font-size:16px;font-weight:700;text-wrap:balance}
.memory p{margin:4px 0 0;color:var(--muted);white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.memory .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
.tag{background:var(--bg);border-radius:6px;padding:1px 8px}
.dayno{font-family:var(--f-num);font-style:italic}

/* ---------- anniversaries ---------- */
.ann{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px}
.ann .left{flex:1;min-width:0}
.ann .name{font-weight:700}
.ann .when{font-size:13px;color:var(--muted)}
.ann .cd{text-align:right;flex-shrink:0}
.ann .cd .n{font-family:var(--f-num);font-weight:600;font-size:28px;line-height:1;color:var(--rose);font-variant-numeric:tabular-nums}
.ann .cd .s{font-size:12px;color:var(--muted)}
.ann.today .cd .n{font-size:18px}
.ann.auto .name::after{content:"自动";font-size:11px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:8px;vertical-align:2px}
.ann .del{flex-shrink:0}

/* ---------- wishes ---------- */
.wish{display:flex;align-items:flex-start;gap:12px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px}
.check{flex-shrink:0;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;color:#fff;margin-top:1px}
.check svg{width:14px;height:14px;opacity:0}
.wish.done .check{background:var(--sage);border-color:var(--sage)}
.wish.done .check svg{opacity:1}
.wish .txt{flex:1;min-width:0;word-break:break-word}
.wish.done .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--sage)}
.wish .doneat{font-size:12px;color:var(--sage);text-decoration:none;display:block}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--sage);border-radius:3px;transition:width .4s}
.progress-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
.add-inline{display:flex;gap:8px}
.add-inline input{flex:1;min-width:0}

/* ---------- empty ---------- */
.empty{text-align:center;padding:36px 20px;color:var(--muted);background:var(--surface);border-radius:16px;border:1.5px dashed var(--line)}
.empty .big{font-family:var(--f-display);font-size:20px;color:var(--ink);margin-bottom:4px}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
input[type=text],input[type=date],textarea,select{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--rose)}
textarea{min-height:110px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tags-pick{display:flex;flex-wrap:wrap;gap:8px}
.tags-pick button{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px}
.tags-pick button[aria-pressed="true"]{border-color:var(--rose);background:var(--rose-soft);color:var(--rose)}
.btn{border:0;border-radius:12px;padding:11px 18px;cursor:pointer;font-weight:700}
.btn.primary{background:var(--rose);color:#fff}
.btn.ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--rose);border:1.5px solid var(--rose)}
.btn:disabled{opacity:.5;cursor:default}
.photo-drop{border:1.5px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--muted);cursor:pointer;display:block}
.photo-drop img{border-radius:8px;margin:0 auto 8px;max-height:200px}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.actions .spacer{flex:1}

/* ---------- sheet ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,14,22,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;
  padding:20px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
@media (min-width:640px){.overlay{align-items:center}.sheet{border-radius:22px}}
.sheet h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px}
.sheet .detail-photo{border-radius:14px;width:100%}
.sheet .detail-text{white-space:pre-wrap;word-break:break-word;margin:0}
.hint{font-size:12px;color:var(--muted);margin:0}

/* ---------- fab / toast / status ---------- */
.fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--rose);color:#fff;box-shadow:0 8px 24px rgba(217,70,92,.4);cursor:pointer;display:grid;place-items:center;z-index:20}
.fab svg{width:26px;height:26px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;z-index:60;max-width:calc(100% - 32px);text-align:center}
.status{font-size:12px;color:var(--muted);text-align:center}
.status b{color:var(--sage);font-weight:500}
.status.warn b{color:var(--rose)}
footer{display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
.lock{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto;display:flex;align-items:center;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lock-card{width:100%;max-width:420px;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:26px 22px;display:flex;flex-direction:column;gap:14px}
.lock-card h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:26px}
.lock-card p{margin:0}
.lock-card .couple{font-size:28px}
.link-btn{border:0;background:none;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero" aria-label="在一起的天数">
    <div class="hero-actions">
      <button class="icon-btn" id="btnSettings" title="设置名字和纪念日" aria-label="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>
    </div>
    <div class="couple"><span id="nameA">你</span><span class="heart" aria-hidden="true">♥</span><span id="nameB">TA</span></div>
    <div class="days">
      <div class="lbl">我们在一起</div>
      <div><span class="num" id="dayNum">—</span><span class="unit">天</span></div>
    </div>
    <div class="breakdown" id="breakdown">设置在一起的日子，开始计数</div>
    <div class="next"><span class="chip" id="nextChip" hidden></span></div>
  </section>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-moments" aria-selected="true" data-tab="moments">时光<span class="count" id="cMoments"></span></button>
    <button class="tab" role="tab" id="tab-dates" aria-selected="false" data-tab="dates">纪念日<span class="count" id="cDates"></span></button>
    <button class="tab" role="tab" id="tab-wishes" aria-selected="false" data-tab="wishes">心愿<span class="count" id="cWishes"></span></button>
  </nav>

  <section id="panel-moments" class="list"></section>
  <section id="panel-dates" class="list" hidden></section>
  <section id="panel-wishes" class="list" hidden></section>

  <p class="status" id="status">正在打开手账…</p>
  <footer>
    <button class="link-btn" id="btnExport">导出备份</button>
    <button class="link-btn" id="btnImport">从备份恢复</button>
    <button class="link-btn" id="btnLogout" hidden>换暗号 / 退出</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </footer>
</div>

<button class="fab" id="fab" aria-label="记录新的时光">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>
<div id="sheetRoot"></div>
<div id="lockRoot" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";

/* ================= 同步设置 =================
   填上你自己 Supabase 项目的地址和公开密钥（publishable / anon key），两个人就能用暗号一起写。
   留空的话，记录只存在当前这台设备上。 */
const CONFIG={
  supabaseUrl:"https://rcfoiynbgxabkxasvxep.supabase.co",
  supabaseKey:"sb_publishable_qM3yG9VuM5nkiDc7-YxHnA_GHmbWEiG"
};

/* fonts load in the background; if Google Fonts can't be reached, system fonts are used */
try{const l=document.createElement("link");l.rel="stylesheet";l.href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400;1,9..144,600&display=swap";document.head.appendChild(l)}catch(_){}

/* ================= storage =================
   Cloud mode: the Claude artifact's shared db.
   Sync mode:  your own Supabase project + a shared passphrase (CONFIG above).
   Local mode: IndexedDB in this browser only. */
const COLS=["memories","dates","wishes"];
const store={mode:"loading",subs:{},data:{memories:{},dates:{},wishes:{},meta:{}}};

function emit(col){(store.subs[col]||[]).forEach(fn=>fn(store.data[col]))}
function on(col,fn){(store.subs[col]=store.subs[col]||[]).push(fn);fn(store.data[col])}

/* --- IndexedDB helpers (local mode + sync cache) --- */
const IDB_NAME="love-notebook",IDB_STORE="kv";
let idbConn=null;
function idb(){if(idbConn)return idbConn;idbConn=new Promise((res,rej)=>{try{const r=indexedDB.open(IDB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(IDB_STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});idbConn.catch(()=>{idbConn=null});return idbConn}
async function idbGet(key){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction(IDB_STORE).objectStore(IDB_STORE).get(key);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error)})}
async function idbPut(key,val){const d=await idb();return new Promise((res,rej)=>{const tx=d.transaction(IDB_STORE,"readwrite");tx.objectStore(IDB_STORE).put(val,key);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function idbDel(key){const d=await idb();return new Promise(res=>{const tx=d.transaction(IDB_STORE,"readwrite");tx.objectStore(IDB_STORE).delete(key);tx.oncomplete=()=>res();tx.onerror=()=>res()})}
let saveTimer=null;
function saveSoon(){clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{
  try{
    if(store.mode==="sync")await idbPut("book:"+SYNC.book,{data:store.data,rev:SYNC.rev,revs:SYNC.revs,pending:SYNC.pending});
    else if(store.mode==="local")await idbPut("all",store.data);
  }catch(e){if(store.mode==="local")setStatus("这个浏览器不让保存数据，请导出备份",true)}
},150)}

/* --- local mode --- */
async function startLocal(){
  store.mode="local";
  try{const saved=await idbGet("all");if(saved){for(const k of [...COLS,"meta"])store.data[k]=saved[k]||{}}}
  catch(e){setStatus("这个浏览器不让保存数据（可能是无痕模式），记得导出备份",true);store.mode="memory"}
  [...COLS,"meta"].forEach(emit);
  if(store.mode==="local")setStatus("<b>●</b> 已保存在这台设备的浏览器里");
}

/* --- cloud mode (Claude artifact db) --- */
let db=null,canWrite=true;
async function startCloud(dbNs){
  db=dbNs;store.mode="cloud";
  let confirmed=false;
  const timer=setTimeout(()=>{if(!confirmed)setStatus("暂时连不上云端，内容可能不是最新的",true)},10000);
  const done=()=>{if(!confirmed){confirmed=true;clearTimeout(timer);setStatus("<b>●</b> 已同步到云端，分享给 TA 就能一起看")}};
  COLS.forEach(col=>{
    db.collection(col).onSnapshot(snap=>{
      const m={};snap.docs.forEach(d=>{m[d.id]=d.data()});store.data[col]=m;emit(col);
      if(!snap.metadata.fromCache)done();
    },err=>{clearTimeout(timer);setStatus("云端连接断开了，请刷新页面",true)});
  });
  db.doc("meta/couple").onSnapshot(s=>{store.data.meta=s.exists?s.data():{};emit("meta")},()=>{});
}

/* --- sync mode (your own Supabase + a shared passphrase) ---
   Everything is encrypted on the phone with a key derived from the passphrase;
   the server only ever sees ciphertext and a book id derived separately. */
const SYNC={book:null,key:null,rev:0,revs:{},pending:{},busy:null,again:false};
const te=new TextEncoder(),td=new TextDecoder();
function b64(buf){const u=buf instanceof Uint8Array?buf:new Uint8Array(buf);let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function unb64(s){const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
function hex(buf){return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("")}
async function derivePass(pass){
  const base=await crypto.subtle.importKey("raw",te.encode(pass),"PBKDF2",false,["deriveBits"]);
  const kdf=salt=>crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:te.encode(salt),iterations:210000},base,256);
  const [idBits,keyBits]=await Promise.all([kdf("love-notebook/book-id/v1"),kdf("love-notebook/enc-key/v1")]);
  return {book:hex(idBits),raw:b64(keyBits)};
}
async function importKey(raw){return crypto.subtle.importKey("raw",unb64(raw),{name:"AES-GCM"},false,["encrypt","decrypt"])}
async function seal(obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},SYNC.key,te.encode(JSON.stringify(obj))));const out=new Uint8Array(12+ct.length);out.set(iv);out.set(ct,12);return b64(out)}
async function open_(s){const u=unb64(s);return JSON.parse(td.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u.subarray(0,12)},SYNC.key,u.subarray(12))))}
async function rpc(fn,args){
  const h={"apikey":CONFIG.supabaseKey,"Content-Type":"application/json"};
  if(CONFIG.supabaseKey.startsWith("eyJ"))h.Authorization="Bearer "+CONFIG.supabaseKey; /* legacy anon JWT key */
  const r=await fetch(CONFIG.supabaseUrl.replace(/\/+$/,"")+"/rest/v1/rpc/"+fn,{method:"POST",headers:h,body:JSON.stringify(args)});
  if(!r.ok)throw Object.assign(new Error(fn+" "+r.status),{status:r.status});
  return r.json();
}
function readSaved(){try{const s=JSON.parse(localStorage.getItem("love-sync")||"null");return s&&s.book&&s.raw?s:null}catch(_){return null}}

async function startSyncFlow(){
  store.mode="sync";
  $("#btnLogout").hidden=false;
  if(!(window.crypto&&crypto.subtle)){setStatus("请用 https 链接打开这个页面",true);return}
  const saved=readSaved();
  if(saved)return startSync(saved);
  showLock();
}
async function startSync(cred){
  SYNC.book=cred.book;SYNC.key=await importKey(cred.raw);
  try{const c=await idbGet("book:"+SYNC.book);if(c){for(const k of [...COLS,"meta"])store.data[k]=(c.data&&c.data[k])||{};SYNC.rev=c.rev||0;SYNC.revs=c.revs||{};SYNC.pending=c.pending||{}}}catch(_){}
  [...COLS,"meta"].forEach(emit);
  setStatus("正在同步…");
  syncNow(true);
  setInterval(()=>{if(!document.hidden)syncNow(false)},20000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)syncNow(true)});
  window.addEventListener("online",()=>syncNow(false));
}
function syncNow(reconcile){
  if(SYNC.busy){SYNC.again=SYNC.again||reconcile||"pull";return SYNC.busy}
  SYNC.busy=doSync(reconcile).finally(()=>{SYNC.busy=null;if(SYNC.again){const r=SYNC.again===true;SYNC.again=false;syncNow(r)}});
  return SYNC.busy;
}
async function doSync(reconcile){
  const changed=new Set();
  try{
    /* 1. send what this phone changed */
    for(const [k,p] of Object.entries(SYNC.pending)){
      const rev=p.deleted?await rpc("love_del",{p_book:SYNC.book,p_col:p.col,p_id:p.id})
                       :await rpc("love_put",{p_book:SYNC.book,p_col:p.col,p_id:p.id,p_data:await seal(p.obj)});
      if(SYNC.pending[k]===p){delete SYNC.pending[k];SYNC.revs[k]=Number(rev)}
    }
    /* 2. look for anything missed (cheap: ids and versions only) */
    if(reconcile){
      const idx=await rpc("love_index",{p_book:SYNC.book});let min=Infinity;
      for(const r of idx){const k=r.col+"/"+r.id;if(SYNC.revs[k]!==Number(r.rev)&&Number(r.rev)<=SYNC.rev&&!SYNC.pending[k])min=Math.min(min,Number(r.rev))}
      if(min!==Infinity)SYNC.rev=min-1;
    }
    /* 3. fetch what the other phone changed */
    for(let guard=0;guard<1000;guard++){
      const rows=await rpc("love_pull",{p_book:SYNC.book,p_since:SYNC.rev});
      for(const r of rows){
        const rev=Number(r.rev),k=r.col+"/"+r.id;SYNC.rev=Math.max(SYNC.rev,rev);
        if(SYNC.pending[k]||SYNC.revs[k]===rev)continue;
        const col=r.col==="meta"?"meta":r.col;if(col!=="meta"&&!COLS.includes(col))continue;
        if(r.deleted){if(col==="meta")store.data.meta={};else{const m={...store.data[col]};delete m[r.id];store.data[col]=m}}
        else{let obj;try{obj=await open_(r.data)}catch(_){continue}
          if(col==="meta")store.data.meta=obj;else store.data[col]={...store.data[col],[r.id]:obj}}
        SYNC.revs[k]=rev;changed.add(col);
      }
      if(rows.length<30)break;
    }
    const left=Object.keys(SYNC.pending).length;
    setStatus(left?`还有 ${left} 条改动没传上去，稍后自动重试`:"<b>●</b> 已同步 · 你们俩看到的是同一本手账",!!left);
  }catch(e){
    setStatus(Object.keys(SYNC.pending).length?"现在连不上网络，改动先存在这台手机上，连上后会自动同步":"现在连不上网络，显示的是上次同步的内容",true);
  }
  changed.forEach(emit);saveSoon();
}
function queue(col,id,obj){
  const k=col+"/"+id;SYNC.pending[k]=obj?{col,id,obj}:{col,id,deleted:true};
  saveSoon();syncNow(false);
}

/* --- one write API for every mode --- */
async function put(col,id,obj){
  if(store.mode==="cloud"){try{await db.collection(col).doc(id).set(obj)}catch(e){handleWriteError(e);throw e}return}
  store.data[col]={...store.data[col],[id]:obj};emit(col);
  if(store.mode==="sync")queue(col,id,obj);else saveSoon();
}
async function del(col,id){
  if(store.mode==="cloud"){try{await db.collection(col).doc(id).delete()}catch(e){handleWriteError(e);throw e}return}
  const m={...store.data[col]};delete m[id];store.data[col]=m;emit(col);
  if(store.mode==="sync")queue(col,id,null);else saveSoon();
}
async function putMeta(obj){
  if(store.mode==="cloud"){try{await db.doc("meta/couple").set(obj)}catch(e){handleWriteError(e);throw e}return}
  store.data.meta=obj;emit("meta");
  if(store.mode==="sync")queue("meta","couple",obj);else saveSoon();
}
function handleWriteError(e){
  const c=e&&e.code;
  if(c==="invalid_argument"){canWrite=false;toast("你现在只能查看，不能修改（请让 TA 把你设为可编辑）")}
  else if(c==="quota_exceeded")toast("空间满了：删掉一些带照片的记录再试试");
  else toast("没保存成功，请稍后再试");
}

/* ================= dates ================= */
const DAY=86400000;
function parseD(s){if(!s)return null;const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function fmtD(dt){return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0")}
function todayD(){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}
function diffDays(a,b){return Math.round((b-a)/DAY)}
function zhDate(s){const d=parseD(s);return d?`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`:""}
const WEEK=["周日","周一","周二","周三","周四","周五","周六"];
/* day count: the first day together counts as day 1 */
function dayNo(start,dateStr){const s=parseD(start),d=parseD(dateStr);return s&&d?diffDays(s,d)+1:null}
function ymd(start){
  const s=parseD(start),t=todayD();if(!s||t<s)return "";
  let y=t.getFullYear()-s.getFullYear(),m=t.getMonth()-s.getMonth(),d=t.getDate()-s.getDate();
  if(d<0){m--;d+=new Date(t.getFullYear(),t.getMonth(),0).getDate()}
  if(m<0){y--;m+=12}
  const parts=[];if(y)parts.push(y+" 年");if(m)parts.push(m+" 个月");parts.push(d+" 天");return parts.join(" ");
}
function nextYearly(dateStr){const d=parseD(dateStr),t=todayD();let n=new Date(t.getFullYear(),d.getMonth(),d.getDate());if(n<t)n=new Date(t.getFullYear()+1,d.getMonth(),d.getDate());return n}

/* automatic milestones from the start date */
function autoMilestones(start){
  const s=parseD(start);if(!s)return [];
  const t=todayD(),cur=diffDays(s,t)+1,out=[];
  const hundreds=[100,200,300,500,520,666,777,1000,1314,1500,2000,2500,3000,3650,5000,5200,10000];
  const nextH=hundreds.find(n=>n>=cur);
  if(nextH){const dt=new Date(s.getTime()+(nextH-1)*DAY);out.push({auto:true,name:`在一起第 ${nextH} 天`,next:dt,label:fmtD(dt)})}
  let yrs=t.getFullYear()-s.getFullYear();let anniv=new Date(s.getFullYear()+yrs,s.getMonth(),s.getDate());
  if(anniv<t){yrs++;anniv=new Date(s.getFullYear()+yrs,s.getMonth(),s.getDate())}
  if(yrs>0)out.push({auto:true,name:`恋爱 ${yrs} 周年`,next:anniv,label:fmtD(anniv)});
  return out;
}

let toastT;function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}

/* compress a photo so each record stays well under the 256 KiB doc limit */
function compressImage(file){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      let max=1000,q=.78,out="";
      for(let i=0;i<8;i++){
        const sc=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        out=c.toDataURL("image/jpeg",q);
        if(out.length<190000)break;
        q=Math.max(.45,q-.08);max=Math.round(max*.85);
      }
      res(out);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("bad image"))};
    img.src=url;
  });
}

/* two-tap delete instead of confirm() */
function armDelete(btn,action,label){
  let armed=false,t;
  btn.addEventListener("click",async e=>{e.stopPropagation();
    if(!armed){armed=true;const o=btn.textContent;btn.textContent=typeof label==="function"?label():(label||"再点一次确认删除");t=setTimeout(()=>{armed=false;btn.textContent=o},3000);return}
    clearTimeout(t);try{await action()}catch(_){}
  });
}

  const m=store.data.meta||{};
  $("#nameA").textContent=m.nameA||"你";$("#nameB").textContent=m.nameB||"TA";
  const s=parseD(m.start);
  if(!s){$("#dayNum").textContent="—";$("#breakdown").textContent="点右上角的笔，填上在一起的日子";$("#nextChip").hidden=true;return}
  const n=diffDays(s,todayD())+1;
  if(n<1){$("#dayNum").textContent="0";$("#breakdown").textContent=`还有 ${1-n} 天就是第一天`;$("#nextChip").hidden=true;return}
  $("#dayNum").textContent=n.toLocaleString("zh-CN");
  $("#breakdown").textContent=`从 ${zhDate(m.start)} 开始 · ${ymd(m.start)}`;
  const up=upcoming()[0];const chip=$("#nextChip");
  if(up){chip.hidden=false;chip.textContent=up.days===0?`今天是「${up.name}」♥`:`距离「${up.name}」还有 ${up.days} 天`}else chip.hidden=true;
}
function upcoming(){
  const t=todayD(),m=store.data.meta||{};
  const list=autoMilestones(m.start).map(a=>({...a,days:diffDays(t,a.next)}));
  Object.entries(store.data.dates).forEach(([id,d])=>{
    if(!d.date)return;
    let next,label;
    if(d.yearly){next=nextYearly(d.date);label=`每年 ${parseD(d.date).getMonth()+1}月${parseD(d.date).getDate()}日`}
    else{next=parseD(d.date);label=zhDate(d.date)}
    list.push({id,name:d.name,next,label,yearly:d.yearly,days:diffDays(t,next),past:diffDays(t,next)<0,date:d.date});
  });
  return list.filter(x=>!x.past).sort((a,b)=>a.days-b.days);
}

  openSheet(`<h2>${id?"编辑这段时光":"记录新的时光"}</h2>
    <div class="row2"><div class="field"><label for="fDate">日期</label><input type="date" id="fDate" value="${esc(it.date||"")}"></div>
    <div class="field"><label for="fTitle">标题</label><input type="text" id="fTitle" maxlength="40" placeholder="第一次一起看电影" value="${esc(it.title||"")}"></div></div>
    <div class="field"><label for="fText">想说的话</label><textarea id="fText" maxlength="3000" placeholder="那天发生了什么？TA 穿了什么？你当时在想什么？">${esc(it.text||"")}</textarea></div>
    <div class="field"><label>标签</label><div class="tags-pick" id="fTags">${TAGS.map(t=>`<button type="button" aria-pressed="${tags.includes(t)}">${t}</button>`).join("")}</div></div>
    <div class="field"><label for="fPhoto">照片（一张）</label><label class="photo-drop" for="fPhoto" id="fDrop">${photo?`<img src="${photo}" alt="">点这里换一张`:"点这里选一张照片"}</label><input type="file" id="fPhoto" accept="image/*" hidden>
    ${photo?`<button type="button" class="link-btn" id="fRmPhoto" style="align-self:flex-start">去掉照片</button>`:""}</div>
    <div class="actions"><button class="btn ghost" id="fCancel">取消</button><button class="btn primary" id="fSave">保存</button></div>`,
  s=>{
    s.querySelector("#fCancel").onclick=closeSheet;
    s.querySelectorAll("#fTags button").forEach(b=>b.onclick=()=>{const t=b.textContent;const on=tags.includes(t);tags=on?tags.filter(x=>x!==t):[...tags,t];b.setAttribute("aria-pressed",!on)});
    const rm=s.querySelector("#fRmPhoto");if(rm)rm.onclick=()=>{photo="";s.querySelector("#fDrop").textContent="点这里选一张照片";rm.remove()};
    s.querySelector("#fPhoto").onchange=async e=>{const f=e.target.files[0];if(!f)return;const drop=s.querySelector("#fDrop");drop.textContent="正在处理照片…";
      try{photo=await compressImage(f);drop.innerHTML=`<img src="${photo}" alt="">点这里换一张`}catch(_){drop.textContent="这张图打不开，换一张试试";photo=""}};
    s.querySelector("#fSave").onclick=async ev=>{
      const date=s.querySelector("#fDate").value,title=s.querySelector("#fTitle").value.trim(),text=s.querySelector("#fText").value.trim();
      if(!date){toast("请选一个日期");return}
      if(!title&&!text&&!photo){toast("写点什么或者放张照片吧");return}
      ev.target.disabled=true;
      try{await put("memories",id||uid(),{date,title,text,tags,photo,created:it.created||Date.now()});closeSheet();toast("已保存 ♥")}
      catch(_){ev.target.disabled=false}
    };
  });
}

function editDate(){
  openSheet(`<h2>添加纪念日</h2>
    <div class="field"><label for="dName">名称</label><input type="text" id="dName" maxlength="30" placeholder="TA 的生日 / 第一次见面"></div>
    <div class="field"><label for="dDate">日期</label><input type="date" id="dDate"></div>
    <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="dYearly" checked> 每年都提醒（生日、纪念日选这个）</label>
    <div class="actions"><button class="btn ghost" id="dCancel">取消</button><button class="btn primary" id="dSave">保存</button></div>`,
  s=>{s.querySelector("#dCancel").onclick=closeSheet;
    s.querySelector("#dSave").onclick=async ev=>{const name=s.querySelector("#dName").value.trim(),date=s.querySelector("#dDate").value;
      if(!name||!date){toast("名称和日期都要填哦");return}
      ev.target.disabled=true;try{await put("dates",uid(),{name,date,yearly:s.querySelector("#dYearly").checked,created:Date.now()});closeSheet();toast("已添加")}catch(_){ev.target.disabled=false}};
  });
}

function editSettings(){
  const m=store.data.meta||{};
  openSheet(`<h2>我们俩</h2>
    <div class="row2"><div class="field"><label for="sA">你的名字</label><input type="text" id="sA" maxlength="12" placeholder="小明" value="${esc(m.nameA||"")}"></div>
    <div class="field"><label for="sB">TA 的名字</label><input type="text" id="sB" maxlength="12" placeholder="小红" value="${esc(m.nameB||"")}"></div></div>
    <div class="field"><label for="sStart">在一起的日子</label><input type="date" id="sStart" value="${esc(m.start||"")}"></div>
    <p class="hint">在一起的那一天算第 1 天。</p>
    <div class="actions"><button class="btn ghost" id="sCancel">取消</button><button class="btn primary" id="sSave">保存</button></div>`,
  s=>{s.querySelector("#sCancel").onclick=closeSheet;
    s.querySelector("#sSave").onclick=async ev=>{ev.target.disabled=true;
      try{await putMeta({nameA:s.querySelector("#sA").value.trim(),nameB:s.querySelector("#sB").value.trim(),start:s.querySelector("#sStart").value});closeSheet();toast("已保存")}
      catch(_){ev.target.disabled=false}};
  });
}

/* ================= backup ================= */
async function exportBackup(){
  const payload=JSON.stringify({app:"love-notebook",version:1,exportedAt:new Date().toISOString(),meta:store.data.meta,memories:store.data.memories,dates:store.data.dates,wishes:store.data.wishes});
  const name=`恋爱手账备份-${fmtD(todayD())}.json`;
  const dl=window.claude&&typeof window.claude.use==="function"?await window.claude.use("downloads").catch(()=>null):null;
  if(dl){try{const r=await dl.save({filename:name,data:payload});if(r&&r.status==="saved")toast("备份已保存")}catch(e){if(e&&e.code!=="cancelled")toast("没能保存备份文件")}return}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([payload],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast("备份已下载")}
  catch(_){toast("这个环境不支持下载")}
}
async function importBackup(file){
  try{
    const j=JSON.parse(await file.text());
    if(j.app!=="love-notebook")throw new Error("not ours");
    for(const col of COLS){for(const [id,v] of Object.entries(j[col]||{})){await put(col,id,v)}}
    if(j.meta&&Object.keys(j.meta).length)await putMeta(j.meta);
    toast("已从备份恢复");
  }catch(e){toast("这个文件不是恋爱手账的备份")}
}

/* ================= boot ================= */
function bindUI(){
  document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));
  $("#fab").addEventListener("click",()=>editMemory(null));
  $("#btnSettings").addEventListener("click",editSettings);
  $("#btnExport").addEventListener("click",exportBackup);
  $("#btnImport").addEventListener("click",()=>$("#importFile").click());
  armDelete($("#btnLogout"),logout,()=>Object.keys(SYNC.pending).length?"还有改动没同步，再点一次也要退出":"再点一次退出（云端的记录不会丢）");
  $("#importFile").addEventListener("change",e=>{const f=e.target.files[0];if(f)importBackup(f);e.target.value=""});
  let saved="moments";try{saved=localStorage.getItem("love-tab")||"moments"}catch(_){}
  setTab(["moments","dates","wishes"].includes(saved)?saved:"moments");
  on("meta",()=>{renderHero();renderMoments();renderDates()});
  on("memories",renderMoments);
  on("dates",()=>{renderDates();renderHero()});
  on("wishes",renderWishes);
}
bindUI();
(async()=>{
  let dbNs=null;
  if(window.claude&&typeof window.claude.use==="function"){try{dbNs=await window.claude.use("db")}catch(_){dbNs=null}}
  if(dbNs)startCloud(dbNs);
  else if(CONFIG.supabaseUrl&&CONFIG.supabaseKey)startSyncFlow();
  else startLocal();
})();
/* roll the counter over at midnight */
setInterval(()=>{renderHero()},60000);
})();
</script>
