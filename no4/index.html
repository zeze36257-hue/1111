<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>没写完的结局</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root { --bg: #000; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  canvas { height: 100vh; width: 56.25vh; max-width: 100vw; max-height: 177.78vw; background: #000; display: block; }
  #hint { position: fixed; left: 0; right: 0; bottom: 16px; text-align: center; color: #888; font: 14px "Noto Sans SC", sans-serif; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1080" height="1920"></canvas></div>
<div id="hint">点击播放 / 暂停 · ← → 快退快进</div>
<script>
'use strict';
// 黑猫不说话 · 心理学 No.4《为什么你忘不掉的，偏偏是没在一起的人》。沿用系列风格：俯视与留白、数字叙事、节奏卡在背景音乐的段落上。
// 每一帧都是时间 T 的纯函数：实时预览与逐帧导出（?export=1）画出的是同一帧。
const W = 1080, H = 1920;
const EXPORT = /[?&]export=1/.test(location.search);
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const PI = Math.PI, TAU = PI * 2;
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const eout = t => 1 - Math.pow(1 - clamp(t), 3);
const eio = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const win = (t, a, b, fi = .4, fo = .4) => sstep(a, a + fi, t) * (1 - sstep(b - fo, b, t));
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const SERIF = '"Noto Serif SC", serif', SANS = '"Noto Sans SC", sans-serif', LAT = '"Cormorant Garamond", serif';
const ORANGE = '#f2a14a', TEAL = '#4fd6c4', CREAM = '#ece6da', DIM = '#8a93a3';
const O_RGB = '242,161,74', T_RGB = '79,214,196';

// 背景音乐的段落（秒）：前奏 0–10.5，安静 10.5–17.25，全编制 17.25 起，89.5 回落
const DROP = 17.25, CALM = 89.5;

// ======================================================================== 基础绘制
function text(s, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.style || ''} ${o.weight || 500} ${o.size || 44}px ${o.font || SERIF}`;
  ctx.textAlign = o.align || 'left'; ctx.textBaseline = o.base || 'middle';
  ctx.globalAlpha *= o.alpha ?? 1; ctx.letterSpacing = (o.ls || 0) + 'px';
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.blur ?? 20; }
  ctx.fillStyle = o.color || CREAM; ctx.fillText(s, x, y);
  ctx.restore();
}
function rr(x, y, w, h, r, fill, stroke, lw = 2) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function floor(c0 = '#161d29', c1 = '#07090d', cx = W / 2, cy = H * .45) {
  const g = ctx.createRadialGradient(cx, cy, 60, cx, cy, H * .85);
  g.addColorStop(0, c0); g.addColorStop(1, c1); ctx.fillStyle = g; ctx.fillRect(-W, -H, W * 3, H * 3);
}
function tiles(x0, y0, w, h, step, col = 'rgba(150,170,210,.05)') {
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 1.5;
  for (let x = x0; x <= x0 + w + .1; x += step) { ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y0 + h); ctx.stroke(); }
  for (let y = y0; y <= y0 + h + .1; y += step) { ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x0 + w, y); ctx.stroke(); }
  ctx.restore();
}
// 从正上方看到的一圈光
function pool(x, y, r, a, col = '255,222,170', edge = true) {
  if (a <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${col},${.34 * a})`); g.addColorStop(.7, `rgba(${col},${.16 * a})`); g.addColorStop(1, `rgba(${col},0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  if (edge) { ctx.strokeStyle = `rgba(${col},${.12 * a})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, r * .78, 0, TAU); ctx.stroke(); }
  ctx.restore();
}
// 俯视的人：肩膀 + 头顶。dir 是面朝方向（弧度，-PI/2 为朝上）
function human(x, y, s, o = {}) {
  const a = o.alpha ?? 1; if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.rotate((o.dir ?? -PI / 2) + PI / 2);
  if (o.phone) {                                     // 手机的光照亮脸前
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(0, -s * .9, 0, 0, -s * .9, s * 1.6);
    g.addColorStop(0, `rgba(150,200,255,${.35 * o.phone})`); g.addColorStop(1, 'rgba(150,200,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, -s * .9, s * 1.6, 0, TAU); ctx.fill(); ctx.restore();
  }
  const body = o.body || '#2a303c';
  ctx.fillStyle = body; ctx.beginPath(); ctx.ellipse(0, s * .32, s * 1.12, s * .6, 0, 0, TAU); ctx.fill();
  const sh = ctx.createLinearGradient(-s, 0, s, 0); sh.addColorStop(0, 'rgba(255,255,255,.08)'); sh.addColorStop(1, 'rgba(0,0,0,.25)');
  ctx.fillStyle = sh; ctx.beginPath(); ctx.ellipse(0, s * .32, s * 1.12, s * .6, 0, 0, TAU); ctx.fill();
  if (o.phone) rr(-s * .22, -s * 1.25, s * .44, s * .62, s * .08, `rgba(200,230,255,${.9 * o.phone})`);
  ctx.fillStyle = o.hair || '#0c0e13'; ctx.beginPath(); ctx.arc(0, 0, s * .52, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = s * .08; ctx.beginPath(); ctx.arc(0, 0, s * .44, PI * 1.1, PI * 1.6); ctx.stroke();
  ctx.restore();
  if (o.ring) {                                      // 主角 / 被标记的人：头顶一圈彩色光环
    ctx.save(); ctx.globalAlpha *= a * (o.ringA ?? 1);
    ctx.shadowColor = o.ring; ctx.shadowBlur = 16; ctx.strokeStyle = o.ring; ctx.lineWidth = Math.max(2.5, s * .1);
    ctx.beginPath(); ctx.arc(x, y, s * .78, 0, TAU); ctx.stroke(); ctx.restore();
  }
}
// 注释标签：从目标点引一条细线到文字，可带大号数字
function callout(x, y, dx, dy, a, big, small, col = CREAM, o = {}) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a;
  const k = eout(o.grow ?? 1);
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.globalAlpha *= .8;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + dx * k, y + dy * k); ctx.lineTo(x + dx * k + Math.sign(dx || 1) * 40 * k, y + dy * k); ctx.stroke();
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, 5, 0, TAU); ctx.fill();
  ctx.restore();
  const tx = x + dx + Math.sign(dx || 1) * 56, al = dx >= 0 ? 'left' : 'right';
  ctx.save(); ctx.globalAlpha *= a * sstep(.5, 1, o.grow ?? 1);
  ctx.font = `700 ${o.bigSize || 64}px ${SERIF}`; ctx.letterSpacing = '0px';
  const bw = big ? ctx.measureText(big).width : 0;
  if (big) text(big, tx, y + dy, { size: o.bigSize || 64, weight: 700, color: col, align: al });
  if (small) text(small, dx >= 0 ? tx + bw + (big ? 14 : 0) : tx - bw - (big ? 14 : 0), y + dy + (big ? 6 : 0), { size: 34, weight: 500, color: o.smallCol || CREAM, align: al });
  ctx.restore();
}
// 右上角的时间 / 年份标签（参考视频里的 2018、2020…）
function stamp(s, a, sub) {
  if (a <= 0) return;
  text(s, W - 96, 412, { font: LAT, weight: 600, size: 54, color: CREAM, align: 'right', alpha: a * .9, ls: 4 });
  if (sub) text(sub, W - 96, 460, { font: LAT, style: 'italic', weight: 500, size: 30, color: DIM, align: 'right', alpha: a });
}
const BOKEH = (() => { const r = mulberry(4); return Array.from({ length: 26 }, () => ({ x: r() * W, y: 300 + r() * 1300, r: 20 + r() * 50, p: r() * TAU, v: .2 + r() * .5 })); })();
function bokeh(t, a) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const b of BOKEH) {
    const al = a * (.04 + .04 * Math.sin(t * b.v + b.p)), y = b.y - t * 8 * b.v;
    const g = ctx.createRadialGradient(b.x, y, 0, b.x, y, b.r); g.addColorStop(0, `rgba(160,190,230,${al})`); g.addColorStop(1, 'rgba(160,190,230,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, y, b.r, 0, TAU); ctx.fill();
  }
  ctx.restore();
}
const GRAIN = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'), im = g.createImageData(256, 256), r = mulberry(3);
  for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0); return c;
})();
function post(T) {
  const v = ctx.createRadialGradient(W / 2, H * .46, H * .28, W / 2, H * .46, H * .8);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.6)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  const f = Math.floor(T * 30), ox = (f * 97) % 256, oy = (f * 61) % 256;
  ctx.save(); ctx.globalAlpha = .06; ctx.globalCompositeOperation = 'overlay';
  ctx.fillStyle = ctx.createPattern(GRAIN, 'repeat'); ctx.translate(-ox, -oy); ctx.fillRect(0, 0, W + 256, H + 256); ctx.restore();
}

// ======================================================================== 共用场景元素
function heartPath(x, y, s) {
  ctx.beginPath(); ctx.moveTo(x, y + s * .35);
  ctx.bezierCurveTo(x - s * .9, y - s * .25, x - s * .45, y - s * .85, x, y - s * .38);
  ctx.bezierCurveTo(x + s * .45, y - s * .85, x + s * .9, y - s * .25, x, y + s * .35); ctx.closePath();
}
// 聊天气泡：side 'L' 是 TA（左），'R' 是你（右）
function bubble(s, x, y, side, a, o = {}) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a;
  ctx.font = `500 40px ${SANS}`; ctx.letterSpacing = '0px';
  const w = ctx.measureText(s).width + 64, h = 86, bx = side === 'R' ? x - w : x, dy = (1 - eout(o.pop ?? 1)) * 20;
  rr(bx, y - h / 2 + dy, w, h, 30, side === 'R' ? 'rgba(242,161,74,.92)' : 'rgba(46,54,70,.96)');
  text(s, bx + 32, y + 2 + dy, { font: SANS, size: 40, color: side === 'R' ? '#21140a' : CREAM });
  if (o.time) text(o.time, x, y + h / 2 + 26 + dy, { font: SANS, size: 24, color: DIM, align: side === 'R' ? 'right' : 'left' });
  if (o.tag) text(o.tag, side === 'R' ? bx - 18 : bx + w + 18, y + h / 2 - 12 + dy, { font: SANS, size: 26, color: o.tagCol || TEAL, align: side === 'R' ? 'right' : 'left', alpha: o.tagA ?? 1 });
  ctx.restore();
}
function avatar(x, y, r, ring = TEAL) {
  ctx.save(); ctx.fillStyle = '#2b3242'; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.fillStyle = '#c9d0de'; ctx.beginPath(); ctx.arc(x, y - r * .18, r * .34, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x, y + r * .62, r * .62, r * .42, 0, PI, TAU); ctx.fill();
  ctx.shadowColor = ring; ctx.shadowBlur = 12; ctx.strokeStyle = ring; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, r + 5, 0, TAU); ctx.stroke();
  ctx.restore();
}
function chatHeader(a, status = '') {
  ctx.save(); ctx.globalAlpha *= a;
  avatar(160, 500, 34);
  text('TA', 220, 488, { font: SANS, weight: 700, size: 38, color: CREAM });
  if (status) text(status, 220, 528, { font: SANS, size: 24, color: DIM });
  ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fillRect(90, 572, 900, 2);
  ctx.restore();
}
const pad2 = n => String(Math.floor(n)).padStart(2, '0');

// 系列标记：黑猫不说话 · 心理学 No.4
const SERIES = '黑猫不说话 · 心理学 No.4';
function seriesTag(y, a) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a;
  ctx.font = `500 30px ${SERIF}`; ctx.letterSpacing = '6px'; const w = ctx.measureText(SERIES).width;
  text(SERIES, W / 2, y, { size: 30, weight: 500, align: 'center', color: ORANGE, ls: 6 });
  ctx.strokeStyle = `rgba(${O_RGB},.5)`; ctx.lineWidth = 1.5;
  for (const k of [-1, 1]) { ctx.beginPath(); ctx.moveTo(W / 2 + k * (w / 2 + 24), y); ctx.lineTo(W / 2 + k * (w / 2 + 84), y); ctx.stroke(); }
  ctx.restore();
}

// ======================================================================== 镜头
const SHOTS = [];
function shot(o) { SHOTS.push(o); return o; }
const INK = '#3b2f2a', PAPER = '#d9cfbd';

// ---------------------------------------------------------------- 0–10.5 钩子：1,095 天记不清，47 天一句没忘（第一帧就是封面）
const MEM = ['「下次，一起去看海吧。」', '「你今天，好像不太开心？」', '「晚安，明天见。」'];
shot({
  t0: 0, t1: 10.5, fi: 0,
  draw(lt, d, T) {
    floor('#131a26', '#05070a');
    text('在一起三年的，记不清了；', W / 2, 430, { size: 56, weight: 700, align: 'center', ls: 4 });
    text('没在一起的，一句都没忘。', W / 2, 520, { size: 66, weight: 900, align: 'center', color: ORANGE, ls: 4, glow: `rgba(${O_RGB},.45)`, blur: 26 });
    text('在一起', 120, 680, { font: SANS, size: 30, color: DIM });
    text('1,095 天', 960, 680, { font: SANS, size: 30, color: DIM, align: 'right' });
    rr(120, 712, 840, 10, 5, 'rgba(236,230,218,.12)');
    for (let i = 0; i < 28; i++) { const a = .16 + .12 * Math.sin(i * 1.7 + T * .6); ctx.fillStyle = `rgba(236,230,218,${a})`; ctx.beginPath(); ctx.arc(132 + i * 30.5, 717, 5, 0, TAU); ctx.fill(); }
    text('记得的：零零星星', 120, 770, { font: SANS, size: 28, color: 'rgba(138,147,163,.7)' });
    text('没在一起', 120, 880, { font: SANS, size: 30, color: ORANGE });
    text('47 天', 960, 880, { font: SANS, size: 30, color: ORANGE, align: 'right' });
    const bw = 840 * 47 / 1095;
    ctx.save(); ctx.shadowColor = ORANGE; ctx.shadowBlur = 20; rr(120, 912, bw, 10, 5, ORANGE); ctx.restore();
    rr(120 + bw, 912, 840 - bw, 10, 5, 'rgba(255,255,255,.05)');
    MEM.forEach((s, i) => {
      const a = sstep(.8 + i * 1.1, 1.2 + i * 1.1, lt); if (a <= 0) return; const y = 1000 + i * 80;
      ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = `rgba(${O_RGB},.5)`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(120 + bw / 2, 922); ctx.lineTo(120 + bw / 2, y); ctx.lineTo(170, y); ctx.stroke(); ctx.restore();
      text(s, 186, y, { size: 40, weight: 500, color: CREAM, alpha: a, glow: `rgba(${O_RGB},.3)`, blur: 14 });
    });
  },
});
// ---------------------------------------------------------------- 10.5–17.25 标题：没写完的结局
shot({
  t0: 10.5, t1: DROP,
  draw(lt, d, T) {
    floor('#121925', '#05070a');
    seriesTag(500, sstep(.6, 1.6, lt));
    text('没写完的结局', W / 2, 640, { size: 116, weight: 900, align: 'center', ls: 14, alpha: sstep(1, 2.2, lt), glow: 'rgba(255,220,170,.25)', blur: 30 });
    text('为什么，忘不掉没在一起的人', W / 2, 760, { size: 40, weight: 500, align: 'center', ls: 10, color: '#a7b0bf', alpha: sstep(2.2, 3.3, lt) });
    const k = eout((lt - 1.6) / 2.2) * .86, cx = 540, cy = 1030, r = 120;           // 一个差一点没画完的圆
    if (k > 0) {
      ctx.save(); ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.strokeStyle = ORANGE; ctx.shadowColor = ORANGE; ctx.shadowBlur = 18; ctx.globalAlpha = sstep(1.4, 2, lt);
      ctx.beginPath(); ctx.arc(cx, cy, r, -PI / 2, -PI / 2 + TAU * k); ctx.stroke();
      const ex = cx + Math.cos(-PI / 2 + TAU * k) * r, ey = cy + Math.sin(-PI / 2 + TAU * k) * r;
      ctx.fillStyle = ORANGE; ctx.beginPath(); ctx.arc(ex, ey, 8 + 3 * Math.sin(lt * 4), 0, TAU); ctx.fill(); ctx.restore();
    }
    ctx.save(); ctx.setLineDash([6, 10]); ctx.strokeStyle = 'rgba(236,230,218,.25)'; ctx.lineWidth = 3; ctx.globalAlpha = sstep(3, 3.8, lt);
    ctx.beginPath(); ctx.arc(cx, cy, r, -PI / 2 + TAU * .86, -PI / 2 + TAU); ctx.stroke(); ctx.restore();
  },
});

// ---------------------------------------------------------------- 17.25–36 1927 年，柏林的咖啡馆：没结账的单子一直亮着
const TABLES = [[330, 700, '2 杯拿铁', 0], [750, 700, '1 杯美式', 1], [330, 930, '热可可 · 蛋糕', 0], [750, 930, '2 杯红茶', 1], [330, 1160, '柠檬水', 1], [750, 1160, '1 杯摩卡', 0]];
shot({
  t0: DROP, t1: 36, fi: .12,
  draw(lt, d, T) {
    const t = DROP + lt;
    floor('#1c1612', '#070504'); tiles(60, 560, 960, 720, 60, 'rgba(210,180,150,.035)');
    let pi = 0;
    TABLES.forEach(([x, y, order, paid], i) => {
      pool(x, y, 170, .55, '255,200,140', false);
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 20; ctx.fillStyle = '#3a2c22'; ctx.beginPath(); ctx.arc(x, y, 62, 0, TAU); ctx.fill(); ctx.restore();
      ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, 62, 0, TAU); ctx.stroke();
      human(x - 108, y, 26, { dir: 0 }); human(x + 108, y, 26, { dir: PI });
      const appear = sstep(18 + i * .2, 18.4 + i * .2, t);
      const pt = 23.2 + (paid ? pi++ : 0) * .35, gone = paid ? sstep(pt + .6, pt + 1.8, t) : 0, glow = paid ? 0 : sstep(23.6, 24.2, t);
      ctx.save(); ctx.globalAlpha = appear * (1 - gone); ctx.translate(x, y - 6 + gone * 10); ctx.rotate((i % 2 ? .06 : -.05));
      if (glow) { ctx.shadowColor = `rgba(${O_RGB},${.8 * glow})`; ctx.shadowBlur = 26; }
      rr(-60, -30, 120, 60, 6, glow ? `rgba(250,226,190,1)` : PAPER); ctx.shadowBlur = 0;
      text(order, 0, 1, { font: SANS, weight: 500, size: 22, align: 'center', color: INK });
      ctx.restore();
      if (paid) {
        const ca = sstep(pt, pt + .25, t) * (1 - sstep(pt + 1.6, pt + 2.2, t));
        rr(x - 56, y + 40, 112, 40, 20, `rgba(${T_RGB},${.9 * ca})`); text('已结账', x, y + 61, { font: SANS, size: 22, align: 'center', color: '#0d1a1b', alpha: ca });
      }
      if (t > 26.6) {
        const a = sstep(26.7 + i * .12, 27.1 + i * .12, t) * (1 - sstep(35.2, 35.8, t));
        text(paid ? '忘了' : '记得', x, y - 88, { font: SANS, weight: 700, size: 30, align: 'center', color: paid ? DIM : ORANGE, alpha: a });
      }
    });
    const wy = 620 + (1 - Math.cos(PI * clamp((t - 17.6) / 9))) / 2 * 620 - (1 - Math.cos(PI * clamp((t - 26.6) / 9))) / 2 * 620;
    human(540, wy, 28, { ring: ORANGE, dir: t < 26.6 ? PI / 2 : -PI / 2 });
    stamp('1927', sstep(17.6, 18.3, t), 'Berlin · Bluma Zeigarnik');
    text('蔡格尼克效应', W / 2, 520, { size: 64, weight: 900, align: 'center', ls: 8, alpha: sstep(31.4, 32, t), glow: 'rgba(255,220,170,.3)', blur: 24 });
  },
});

// ---------------------------------------------------------------- 36–50 反转：没有记得更牢，但会忍不住想做完
const GROUPS = [
  { cx: 320, q: '没做完的，记得更牢？', a: '并没有', at: 40.8, bars: [['没做完', .5], ['做完了', .48]], t: 36.8 },
  { cx: 760, q: '被打断的事，会接着做？', a: '会', at: 45, bars: [['想接着做', .84], ['放着不管', .2]], t: 45 },
];
shot({
  t0: 36, t1: 50,
  draw(lt, d, T) {
    const t = 36 + lt, BASE = 1120, MAXH = 380;
    floor('#141a26', '#05070a');
    const strike = eout((t - 40.9) / .6), oldA = 1 - sstep(46.6, 47.1, t);           // 划掉“蔡格尼克效应”，换上“奥夫相基娜效应”
    text('蔡格尼克效应', W / 2, 520, { size: 64, weight: 900, align: 'center', ls: 8, alpha: oldA * (1 - .55 * strike) });
    if (strike > 0 && oldA > 0) { ctx.save(); ctx.globalAlpha = oldA; ctx.strokeStyle = ORANGE; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(300, 522); ctx.lineTo(300 + 480 * strike, 522); ctx.stroke(); ctx.restore(); }
    text('奥夫相基娜效应', W / 2, 520, { size: 64, weight: 900, align: 'center', ls: 8, color: ORANGE, alpha: sstep(47.1, 47.7, t), glow: `rgba(${O_RGB},.45)`, blur: 24 });
    text('Ovsiankina Effect', W / 2, 590, { font: LAT, style: 'italic', weight: 500, size: 32, align: 'center', color: DIM, alpha: sstep(47.4, 48, t) });
    ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(120, BASE); ctx.lineTo(960, BASE); ctx.stroke();
    GROUPS.forEach((g, gi) => {
      const ga = sstep(g.t - .2, g.t + .3, t); if (ga <= 0) return;
      text(g.q, g.cx, 690, { font: SANS, weight: 500, size: 27, align: 'center', color: CREAM, alpha: ga });
      g.bars.forEach(([lab, v], bi) => {
        const x = g.cx + (bi ? 20 : -130), h = MAXH * v * eout((t - g.t - .2 - bi * .15) / 1);
        const hi = bi === 0 && gi === 1;
        ctx.save(); if (hi) { ctx.shadowColor = ORANGE; ctx.shadowBlur = 20; }
        rr(x, BASE - h, 110, h, 8, hi ? ORANGE : bi === 0 ? 'rgba(242,161,74,.55)' : 'rgba(236,230,218,.4)'); ctx.restore();
        text(lab, x + 55, BASE + 36, { font: SANS, size: 26, align: 'center', color: DIM, alpha: ga });
      });
      if (gi === 0) text('≈', g.cx, BASE - MAXH * .5 - 50, { font: SANS, weight: 700, size: 56, align: 'center', color: CREAM, alpha: sstep(38.4, 38.9, t) });
      text(g.a, g.cx, 760, { weight: 900, size: 44, align: 'center', color: ORANGE, alpha: sstep(g.at, g.at + .4, t) });
    });
    text('示意图', 960, BASE + 76, { font: SANS, size: 22, align: 'right', color: 'rgba(138,147,163,.6)', alpha: sstep(37, 37.5, t) });
    stamp('2025', sstep(36.3, 37, t), 'Ghibellini & Meier · Bern');
  },
});

// ---------------------------------------------------------------- 50–60 后悔：短期后悔做过的，长期后悔没做的
const RX0 = 190, RX1 = 890, RYB = 1080, RYT = 690;
const rx = u => lerp(RX0, RX1, u), ry = v => RYB - v * (RYB - RYT);
const DONE = u => .82 - .62 * u, UNDONE = u => .2 + .7 * u;
shot({
  t0: 50, t1: 60,
  draw(lt, d, T) {
    const t = 50 + lt;
    floor('#151525', '#050508');
    ctx.save(); ctx.globalAlpha = sstep(50.3, 50.9, t); ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(RX0, RYT - 40); ctx.lineTo(RX0, RYB); ctx.lineTo(RX1 + 30, RYB); ctx.stroke(); ctx.restore();
    text('后悔的程度', RX0, RYT - 80, { font: SANS, size: 28, color: DIM, alpha: sstep(50.3, 50.9, t) });
    [['一周后', .08], ['一年后', .5], ['很多年后', .92]].forEach(([s, u]) => text(s, rx(u), RYB + 44, { font: SANS, size: 28, align: 'center', color: CREAM, alpha: sstep(50.5, 51.1, t) }));
    text('时间 →', W / 2, RYB + 100, { font: SANS, size: 26, align: 'center', color: DIM, alpha: sstep(50.5, 51.1, t) });
    const p = eio((t - 54.5) / 4);
    for (const [f, col, rgb, lab, dy] of [[DONE, TEAL, T_RGB, '后悔做过的', 40], [UNDONE, ORANGE, O_RGB, '后悔没做的', -40]]) {
      if (p <= 0) continue;
      ctx.save(); ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.strokeStyle = col; ctx.shadowColor = `rgba(${rgb},.6)`; ctx.shadowBlur = 14; ctx.beginPath();
      for (let u = 0; u <= p + 1e-6; u += .01) { const x = rx(u), y = ry(f(u)); u === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
      ctx.stroke(); ctx.restore();
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(rx(p), ry(f(p)), 9, 0, TAU); ctx.fill();
      text(lab, rx(Math.min(p, .98)) - 10, ry(f(Math.min(p, .98))) + dy, { font: SANS, weight: 700, size: 30, align: 'right', color: col, alpha: sstep(55.2, 55.8, t) });
    }
    const cu = .62 / 1.32;
    if (p > cu) pool(rx(cu), ry(DONE(cu)), 90, sstep(cu, cu + .1, p), '255,220,170', false);
    stamp('1994', sstep(50.3, 51, t), 'Gilovich & Medvec');
  },
});

// ---------------------------------------------------------------- 60–74 写下来：连续 4 天、每天 15 分钟，最后折成一封不寄出的信
function envelope(cx, cy, w, h, a, o = {}) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(cx, cy);
  ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 40; rr(-w / 2, -h / 2, w, h, 10, PAPER); ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(59,47,42,.35)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-w / 2, -h / 2); ctx.lineTo(0, h * .08); ctx.lineTo(w / 2, -h / 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-w / 2, h / 2); ctx.lineTo(-w * .12, -h * .02); ctx.moveTo(w / 2, h / 2); ctx.lineTo(w * .12, -h * .02); ctx.stroke();
  ctx.shadowColor = ORANGE; ctx.shadowBlur = 20; ctx.fillStyle = '#c96a2c'; ctx.beginPath(); ctx.arc(0, h * .08, w * .07, 0, TAU); ctx.fill(); ctx.shadowBlur = 0;
  text('给 TA', -w / 2 + 34, -h / 2 + 44, { size: 32, weight: 700, color: INK });
  text('不寄出', w / 2 - 34, h / 2 - 40, { size: 30, weight: 700, color: '#a8452c', align: 'right' });
  ctx.restore();
}
shot({
  t0: 60, t1: 74,
  draw(lt, d, T) {
    const t = 60 + lt;
    floor('#1e1914', '#080605');
    pool(700, 640, 520, 1, '255,205,140', false);
    const fold = eio((t - 69.9) / 1.2), day = Math.min(4, 1 + Math.floor(clamp((t - 64.1) / 1.4) * 4 - 1e-6) + (t >= 64.1 ? 0 : 0));
    const pa = sstep(60.1, 60.7, t) * (1 - fold);
    if (pa > 0) {
      ctx.save(); ctx.globalAlpha = pa; ctx.translate(540, 900); ctx.rotate(-.03); ctx.scale(lerp(1, .6, fold), lerp(1, .45, fold));
      for (let k = 3; k >= 1; k--) if (t > 64.1 + (k - 1) * 1.4 && t < 69.9) { ctx.save(); ctx.translate(k * 10, k * 8); rr(-280, -380, 560, 760, 10, 'rgba(217,207,189,.35)'); ctx.restore(); }
      ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 40; rr(-280, -380, 560, 760, 10, PAPER); ctx.shadowBlur = 0;
      const dlt = t < 64.1 ? 0 : ((t - 64.1) % 1.4) / 1.4;
      text(t < 64.1 ? '给 TA 的结局' : `第 ${day} 天`, -230, -320, { size: 38, weight: 700, color: INK });
      if (t >= 64.1) text(`${pad2(15 * (1 - dlt))}:${pad2((15 * (1 - dlt) * 60) % 60)}`, 230, -320, { font: SANS, weight: 500, size: 30, color: '#a8452c', align: 'right' });
      ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.lineCap = 'round';
      const lines = t < 64.1 ? 0 : dlt * 10;
      for (let j = 0; j < 10; j++) {
        const len = [420, 380, 440, 300, 410, 360, 430, 260, 390, 330][j], prog = clamp(lines - j);
        if (prog <= 0) continue;
        const y0 = -230 + j * 58; ctx.beginPath();
        for (let x = 0; x <= len * prog; x += 4) { const y = y0 + Math.sin(x * .17 + j) * 3 + Math.sin(x * .031 + j * 2) * 2; x === 0 ? ctx.moveTo(-230 + x, y) : ctx.lineTo(-230 + x, y); }
        ctx.stroke();
      }
      ctx.restore();
    }
    envelope(540, 900, 600, 380, sstep(70.4, 71, t));
    text('之后的研究，结论不一', W - 96, 1250, { font: SANS, size: 24, align: 'right', color: DIM, alpha: sstep(70.4, 71, t) });
    stamp('1986', sstep(64.1, 64.8, t), 'Pennebaker & Beall');
  },
});
// ---------------------------------------------------------------- 74–81 结尾：今晚，写一封不寄出的信
shot({
  t0: 74, t1: 81, fo: 1,
  draw(lt, d, T) {
    floor('#1a1410', '#050403'); bokeh(T, .6);
    text('你最忘不掉的那个人，', W / 2, 440, { size: 56, weight: 700, align: 'center', ls: 4, alpha: sstep(.2, .9, lt) });
    text('名字的首字母是？', W / 2, 525, { size: 72, weight: 900, align: 'center', color: ORANGE, ls: 6, alpha: sstep(.6, 1.3, lt), glow: `rgba(${O_RGB},.45)`, blur: 26 });
    envelope(540, 860, 520, 330, 1);
    const ia = sstep(1.6, 2.2, lt);
    rr(160, 1110, 760, 90, 45, `rgba(40,47,62,${.95 * ia})`, `rgba(255,255,255,${.08 * ia})`, 2);
    text('评论区，留一个字母就好' + (Math.floor(lt * 2) % 2 ? '｜' : ''), 210, 1156, { font: SANS, size: 34, color: '#aab2c0', alpha: ia });
  },
});

// ======================================================================== 字幕（左下角）
// [起, 止, 文本]；「」里的字用橙色
const SUBS = [
  [.3, 4.8, '为什么你忘不掉的，偏偏是没在一起的人？'], [5.1, 10.2, '看完这一期，也许你能放下一点。'],
  [10.8, 16.8, '这一期，我们聊聊「意难平」。'],
  [17.5, 21.5, '1927 年，柏林的一家咖啡馆。'],
  [21.8, 26.4, '据说，服务员记得每一桌没结账的单；一结账，就忘了。'],
  [26.7, 31.0, '心理学家蔡格尼克做了实验：没做完的事，记得更牢。'],
  [31.3, 35.7, '这就是有名的「蔡格尼克效应」。'],
  [36.2, 40.4, '但 2025 年，一项汇总了几十项研究的分析发现：'],
  [40.7, 44.4, '没做完的事，并没有记得更牢。'],
  [44.7, 49.6, '真正稳定的是另一件事：人会忍不住，想回去把它做完。'],
  [50.2, 54.1, '康奈尔的心理学家 Gilovich 还发现：'],
  [54.4, 59.6, '短期里，人更后悔做过的事；时间越久，越后悔没做的事。'],
  [60, 63.8, '没在一起的人，就是一件「没做完的事」。'],
  [64.1, 69.6, '1986 年，Pennebaker 让学生连续 4 天、每天写 15 分钟，写下最放不下的事。'],
  [69.9, 73.8, '几个月后，他们去校医院的次数变少了。'],
  [74.4, 78.8, '今晚，给 TA 写一封不寄出的信吧。'],
];

const SUB = { x: 96, y: 1420, size: 46, max: 880, lh: 66 };
function subLines(s) {
  const runs = []; let hi = false;
  for (const ch of s) { if (ch === '「') { hi = true; continue; } if (ch === '」') { hi = false; continue; } runs.push({ ch, hi }); }
  ctx.font = `500 ${SUB.size}px ${SERIF}`; ctx.letterSpacing = '2px';
  const width = cs => cs.reduce((w, c) => w + ctx.measureText(c.ch).width + 2, 0);
  if (width(runs) <= SUB.max) return [runs];
  let best = Math.floor(runs.length / 2), bd = 1e9;
  runs.forEach((c, i) => { if ('，、：；'.includes(c.ch) && Math.abs(i - runs.length / 2) < bd) { bd = Math.abs(i - runs.length / 2); best = i + 1; } });
  return [runs.slice(0, best), runs.slice(best)];
}
function subtitles(T) {
  const g = ctx.createLinearGradient(0, 1240, 0, 1600); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.45, 'rgba(0,0,0,.5)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 1240, W, 360);
  for (const [a0, b0, s] of SUBS) {
    if (T < a0 - .1 || T > b0 + .1) continue;
    const a = win(T, a0, b0, .35, .35); if (a <= 0) continue;
    const lines = subLines(s);
    lines.forEach((ln, i) => {
      let x = SUB.x; const y = SUB.y + (i - (lines.length - 1)) * SUB.lh;
      ctx.font = `500 ${SUB.size}px ${SERIF}`; ctx.letterSpacing = '2px';
      ln.forEach(c => { const w = ctx.measureText(c.ch).width + 2; text(c.ch, x, y, { size: SUB.size, weight: 500, color: c.hi ? ORANGE : CREAM, alpha: a, glow: 'rgba(0,0,0,.9)', blur: 12 }); x += w; });
    });
  }
}

// ======================================================================== 顶部分段进度条
const SECTIONS = [['钩子', 0, DROP], ['咖啡馆', DROP, 36], ['反转', 36, 50], ['后悔', 50, 60], ['写下来', 60, 74], ['结尾', 74, 81]];
const TOTAL = 81;
// 进度条放在 TikTok 顶部“关注 / 推荐”栏之下，避免被 App 的界面挡住
const PB = { y: 336, h: 4, x0: 96, x1: 984, gap: 10 };
function progress(T) {
  const span = PB.x1 - PB.x0 - PB.gap * (SECTIONS.length - 1);
  let x = PB.x0, cur = 0;
  SECTIONS.forEach(([name, a, b], i) => {
    const w = span * (b - a) / TOTAL, f = clamp((T - a) / (b - a)); if (T >= a) cur = i;
    rr(x, PB.y, w, PB.h, 2, 'rgba(255,255,255,.16)');
    if (f > 0) { ctx.save(); if (f < 1) { ctx.shadowColor = `rgba(${O_RGB},.9)`; ctx.shadowBlur = 10; } rr(x, PB.y, Math.max(PB.h, w * f), PB.h, 2, f < 1 ? ORANGE : 'rgba(236,230,218,.75)'); ctx.restore(); }
    x += w + PB.gap;
  });
  text(`${String(cur + 1).padStart(2, '0')}  ${SECTIONS[cur][0]}`, PB.x0, PB.y - 32, { size: 28, weight: 500, color: CREAM, alpha: .85, ls: 4 });
  text(`${String(cur + 1).padStart(2, '0')} / ${String(SECTIONS.length).padStart(2, '0')}`, PB.x1, PB.y - 32, { font: LAT, weight: 600, size: 30, color: DIM, align: 'right', ls: 2 });
}

// ======================================================================== 水印
// 低透明度、缓慢漂移；画在场景层里，所以会跟着每个镜头一起淡入淡出。活动范围避开进度条和字幕。
const WM = '@黑猫不说话';
function watermark(T) {
  const x = 540 + Math.sin(T * TAU / 47) * 210 + Math.sin(T * TAU / 83 + 1) * 50;
  const y = 860 + Math.sin(T * TAU / 61 + .7) * 300;
  text(WM, x, y, { font: SANS, weight: 500, size: 30, align: 'center', color: '#ffffff', alpha: .16 * sstep(0, 1.5, T), ls: 2 });
}

// ======================================================================== 帧
const shotAt = T => { let s = SHOTS[0]; for (const S of SHOTS) if (T >= S.t0) s = S; return s; };
function frame(T) {
  T = clamp(T, 0, TOTAL - 1e-3);
  const S = shotAt(T), lt = T - S.t0, d = S.t1 - S.t0;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.letterSpacing = '0px'; ctx.setLineDash([]);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  const z = 1 + .025 * lt / d; ctx.translate(W / 2, H * .5); ctx.scale(z, z); ctx.translate(-W / 2, -H * .5);   // 缓慢推近
  S.draw(lt, d, T);
  watermark(T);
  ctx.restore();
  const fi = S.fi ?? .45, fo = S.fo ?? .45, dip = 1 - (fi > 0 ? sstep(0, fi, lt) : 1) * (1 - sstep(d - fo, d, lt));
  if (dip > 0) { ctx.fillStyle = `rgba(0,0,0,${dip})`; ctx.fillRect(0, 0, W, H); }
  post(T); subtitles(T); progress(T);
}

// ======================================================================== 字体、播放与导出接口
let fontsReady = false;
Promise.all([['900', SERIF], ['700', SERIF], ['500', SERIF], ['700', SANS], ['500', SANS], ['italic 500', LAT], ['italic 600', LAT], ['600', LAT]]
  .map(([w, f]) => document.fonts.load(`${w} 40px ${f}`, '没写完的结局 Aa')))
  .then(() => document.fonts.ready).then(() => { fontsReady = true; frame(0); });
window.__ready = () => fontsReady;
window.__frame = (t, q = .95) => { frame(t); return cv.toDataURL('image/jpeg', q); };
window.__duration = () => TOTAL;
window.__cues = () => ({ total: TOTAL, cues: [], sections: SECTIONS.map(([name, t0, t1]) => ({ name, t0, t1, lines: [] })) });

if (!EXPORT) {
  const au = new Audio("../video2/bgm.m4a");
  let playing = false, clock0 = 0, pausedAt = 0, useAudio = true;
  const now = () => useAudio && !au.paused ? au.currentTime : playing ? (performance.now() - clock0) / 1000 : pausedAt;
  function loop() { if (!playing) return; const T = now(); frame(T); if (T >= TOTAL) { playing = false; pausedAt = 0; au.pause(); return; } requestAnimationFrame(loop); }
  function play() { playing = true; clock0 = performance.now() - pausedAt * 1000; au.currentTime = pausedAt; au.play().catch(() => { useAudio = false; }); requestAnimationFrame(loop); }
  function pause() { pausedAt = now(); playing = false; au.pause(); }
  document.getElementById('stage').onclick = () => playing ? pause() : play();
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { const t = clamp(now() + (e.code === 'ArrowRight' ? 5 : -5), 0, TOTAL); pausedAt = t; clock0 = performance.now() - t * 1000; au.currentTime = t; if (!playing) frame(t); }
  });
} else document.getElementById('hint').remove();
</script>
