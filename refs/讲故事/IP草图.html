<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; background: #1b1b1f; font-family: "Noto Sans CJK SC", "WenQuanYi Zen Hei", sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(5, 360px); gap: 22px; padding: 28px; }
  .card { background: #26262c; border-radius: 22px; padding: 18px 18px 14px; text-align: center; }
  .card svg { width: 324px; height: 324px; display: block; margin: 0 auto; border-radius: 18px; }
  .name { color: #fff; font-size: 34px; font-weight: 700; margin-top: 12px; letter-spacing: 2px; }
  .tag { color: #b9b9c3; font-size: 19px; margin-top: 6px; line-height: 1.45; }
  .note { color: #8c8c96; font-size: 18px; padding: 0 30px 24px; }
</style></head>
<body>
<div class="grid">

<!-- 1 仙人掌柜：沙漠里开小酒馆的仙人掌，戴牛仔帽，搭着擦杯子的毛巾 -->
<div class="card">
<svg viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#f6e3b4"/>
  <ellipse cx="200" cy="368" rx="120" ry="14" fill="#e2c88f"/>
  <g stroke="#1d1d1d" stroke-width="13" stroke-linejoin="round" stroke-linecap="round">
    <path d="M118 230 q-40 0 -40 -45 v-30 q0 -18 18 -18 q18 0 18 18 v28 q0 12 14 12" fill="#6fbf5f"/>
    <path d="M282 255 q40 0 40 -45 v-22 q0 -18 -18 -18 q-18 0 -18 18 v20 q0 12 -14 12" fill="#6fbf5f"/>
    <rect x="128" y="150" width="144" height="215" rx="72" fill="#6fbf5f"/>
    <path d="M282 262 l26 40 l-34 4 z" fill="#fffaf0"/>
    <path d="M104 142 q96 -22 192 0 q-4 16 -26 18 h-140 q-22 -2 -26 -18 z" fill="#8a5a2e"/>
    <path d="M148 140 q6 -52 52 -54 q46 2 52 54 z" fill="#8a5a2e"/>
    <path d="M150 128 h100" stroke="#d6403a" stroke-width="12"/>
  </g>
  <g fill="#1d1d1d"><ellipse cx="174" cy="215" rx="11" ry="16"/><ellipse cx="226" cy="215" rx="11" ry="16"/></g>
  <path d="M184 252 q16 12 32 0" stroke="#1d1d1d" stroke-width="9" fill="none" stroke-linecap="round"/>
  <g stroke="#2f6f28" stroke-width="5" stroke-linecap="round"><path d="M150 290 l-8 -4"/><path d="M250 300 l8 -4"/><path d="M160 330 l-8 -4"/><path d="M240 335 l8 -4"/></g>
</svg>
<div class="name">仙人掌柜</div>
<div class="tag">沙漠里开小酒馆的仙人掌<br>“今晚讲个什么呢……”</div>
</div>

<!-- 2 话匣子：老收音机，喇叭网就是脸 -->
<div class="card">
<svg viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#cfe7e3"/>
  <g stroke="#1d1d1d" stroke-width="13" stroke-linejoin="round" stroke-linecap="round">
    <path d="M150 112 l-36 -58" fill="none"/>
    <rect x="70" y="112" width="260" height="200" rx="46" fill="#e8643c"/>
    <circle cx="170" cy="212" r="66" fill="#f7ead2"/>
    <circle cx="280" cy="176" r="18" fill="#f2c14e"/>
    <circle cx="280" cy="250" r="18" fill="#f2c14e"/>
    <path d="M110 312 v30 M290 312 v30"/>
  </g>
  <circle cx="114" cy="54" r="10" fill="#1d1d1d"/>
  <g fill="#1d1d1d"><ellipse cx="148" cy="196" rx="9" ry="14"/><ellipse cx="192" cy="196" rx="9" ry="14"/></g>
  <path d="M146 236 q24 18 48 0" stroke="#1d1d1d" stroke-width="9" fill="none" stroke-linecap="round"/>
  <g stroke="#c9b28c" stroke-width="5" stroke-linecap="round"><path d="M118 212 h10"/><path d="M212 212 h10"/></g>
</svg>
<div class="name">话匣子</div>
<div class="tag">一台老收音机，什么故事都讲<br>“咳咳……喂喂，开讲啦”</div>
</div>

<!-- 3 老帽：一顶戴过很多英雄的牛仔帽 -->
<div class="card">
<svg viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#f3d9c4"/>
  <ellipse cx="200" cy="330" rx="130" ry="14" fill="#dcbca3"/>
  <g stroke="#1d1d1d" stroke-width="13" stroke-linejoin="round" stroke-linecap="round">
    <path d="M52 262 q148 -40 296 0 q-10 40 -60 44 h-176 q-50 -4 -60 -44 z" fill="#9b6334"/>
    <path d="M110 258 q-6 -120 50 -150 q40 18 80 0 q56 30 50 150 z" fill="#9b6334"/>
    <path d="M114 222 q86 18 172 0" stroke-width="16" stroke="#1d1d1d" fill="none"/>
  </g>
  <path d="M116 222 q84 16 168 0" stroke="#e8c44a" stroke-width="7" fill="none"/>
  <g fill="#1d1d1d"><ellipse cx="172" cy="176" rx="11" ry="16"/><ellipse cx="228" cy="176" rx="11" ry="16"/></g>
  <path d="M182 200 q18 -10 36 0" stroke="#1d1d1d" stroke-width="8" fill="none" stroke-linecap="round"/>
  <circle cx="150" cy="140" r="6" fill="#1d1d1d" opacity=".25"/>
</svg>
<div class="name">老帽</div>
<div class="tag">一顶戴过很多英雄的牛仔帽<br>“这事儿，我在场。”</div>
</div>

<!-- 4 灯芯儿：煤油灯里的一小团火 -->
<div class="card">
<svg viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#2c3550"/>
  <circle cx="200" cy="205" r="150" fill="#f2a14a" opacity=".16"/>
  <g stroke="#1d1d1d" stroke-width="13" stroke-linejoin="round" stroke-linecap="round">
    <path d="M200 52 v-20 M168 52 h64" fill="none"/>
    <path d="M150 300 q-30 -60 -14 -140 q20 -60 64 -64 q44 4 64 64 q16 80 -14 140 z" fill="#fff4d6" fill-opacity=".9"/>
    <path d="M200 120 q44 48 30 96 q-10 34 -30 36 q-20 -2 -30 -36 q-14 -48 30 -96 z" fill="#ffb238"/>
    <rect x="132" y="296" width="136" height="56" rx="14" fill="#8a5a2e"/>
  </g>
  <g fill="#1d1d1d"><ellipse cx="186" cy="208" rx="7" ry="11"/><ellipse cx="214" cy="208" rx="7" ry="11"/></g>
  <path d="M190 232 q10 8 20 0" stroke="#1d1d1d" stroke-width="7" fill="none" stroke-linecap="round"/>
</svg>
<div class="name">灯芯儿</div>
<div class="tag">煤油灯里的一小团火<br>“灯一亮，故事就开始了”</div>
</div>

<!-- 5 风滚草：滚过很多地方的一团草 -->
<div class="card">
<svg viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#f4e6c6"/>
  <ellipse cx="205" cy="338" rx="110" ry="12" fill="#e2cf9f"/>
  <g stroke="#7a5a2e" stroke-width="7" fill="none" stroke-linecap="round" opacity=".9">
    <path d="M110 200 q60 -110 160 -40 q60 70 -20 140 q-90 50 -140 -30 q-30 -60 40 -90 q70 -20 90 40"/>
    <path d="M130 150 q90 -40 140 40 q20 70 -60 90"/>
    <path d="M100 240 q40 60 120 50 q70 -10 80 -90"/>
    <path d="M160 120 q-50 40 -40 110"/>
  </g>
  <circle cx="200" cy="215" r="112" fill="none" stroke="#1d1d1d" stroke-width="13" stroke-dasharray="40 18" stroke-linecap="round"/>
  <g fill="#1d1d1d"><ellipse cx="180" cy="208" rx="11" ry="16"/><ellipse cx="228" cy="208" rx="11" ry="16"/></g>
  <g stroke="#1d1d1d" stroke-width="8" stroke-linecap="round"><path d="M40 190 h34"/><path d="M30 230 h44"/><path d="M48 270 h28"/></g>
</svg>
<div class="name">风滚草</div>
<div class="tag">滚过很多地方的一团草<br>“我路过的时候，听说……”</div>
</div>

</div>
<div class="note">草图，只看想法。定下来以后再画精致的版本。</div>
</body></html>
