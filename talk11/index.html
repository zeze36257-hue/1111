<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>把自己捡回来</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root { --bg: #000; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  canvas { height: 100vh; width: 56.25vh; max-width: 100vw; max-height: 177.78vw; background: #000; display: block; }
  #hint { position: fixed; left: 0; right: 0; bottom: 16px; text-align: center; color: #888; font: 14px "Noto Sans SC", sans-serif; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1080" height="1920"></canvas></div>
<div id="hint">点击播放 / 暂停 · ← → 快退快进</div>
<script>
// 黑猫不说话 · 心理学 No.54《把自己捡回来》
// 电影感引擎（第三季起）：连续镜头、形变转场、逐字浮现的字幕、动态模糊、泛光与胶片颗粒。
// 每一帧仍是时间 T 的纯函数：实时预览与逐帧导出（?export=1）画出的是同一帧。
'use strict';
// ======================================================================== 基础
const W = 1080, H = 1920, FPS = 30, SHUTTER = .5;                 // 180° 快门：每帧曝光半个帧间隔
const EXPORT = /[?&]export=1/.test(location.search);
const cv = document.getElementById('c'), OUT = cv.getContext('2d');
const mk = (w, h) => Object.assign(document.createElement('canvas'), { width: w, height: h });
const LAYER = mk(W, H), LCTX = LAYER.getContext('2d');          // 动态模糊：子帧先画在这里，再平均到 OUT
const BLOOM = mk(W / 4, H / 4), BCTX = BLOOM.getContext('2d');   // 泛光：缩小、提亮部、模糊后叠回去
let ctx = OUT;

const PI = Math.PI, TAU = PI * 2;
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const sstep = (a, b, x) => { const t = prog(x, a, b); return t * t * (3 - 2 * t); };
const win = (t, a, b, fi = .5, fo = .5) => sstep(a, a + fi, t) * (1 - sstep(b - fo, b, t));
const E = {
  lin: t => clamp(t),
  io: t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; },
  out: t => 1 - Math.pow(1 - clamp(t), 3),
  in: t => Math.pow(clamp(t), 3),
  outQuint: t => 1 - Math.pow(1 - clamp(t), 5),
  outExpo: t => (t = clamp(t)) >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => (t = clamp(t)) <= 0 ? 0 : Math.pow(2, 10 * t - 10),
  ioExpo: t => { t = clamp(t); return t <= 0 ? 0 : t >= 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2; },
  ioSine: t => -(Math.cos(PI * clamp(t)) - 1) / 2,
};
// 关键帧轨道：[[t, v, ease?], …]，ease 作用于从这一帧到下一帧的那一段（默认三次缓入缓出）
function track(keys) {
  return T => {
    if (T <= keys[0][0]) return keys[0][1];
    for (let i = 0; i < keys.length - 1; i++) {
      const [a, va, e] = keys[i], [b, vb] = keys[i + 1];
      if (T < b) return lerp(va, vb, (e || E.io)((T - a) / (b - a)));
    }
    return keys[keys.length - 1][1];
  };
}
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash2(i, j) { let h = Math.imul(i, 374761393) + Math.imul(j, 668265263) | 0; h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; }
function vnoise(x, y) {
  const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  return lerp(lerp(hash2(i, j), hash2(i + 1, j), u), lerp(hash2(i, j + 1), hash2(i + 1, j + 1), u), v);
}
function fbm(x, y, o = 4) { let s = 0, a = .5, f = 1, n = 0; for (let k = 0; k < o; k++) { s += a * vnoise(x * f, y * f); n += a; f *= 2.03; a *= .5; } return s / n; }

const SERIF = '"Noto Serif SC", serif', SANS = '"Noto Sans SC", sans-serif', LAT = '"Cormorant Garamond", serif';
const ORANGE = '#f2a14a', TEAL = '#4fd6c4', CREAM = '#ece6da', DIM = '#8a93a3';
const O_RGB = '242,161,74', T_RGB = '79,214,196', C_RGB = '236,230,218';

function reset(c) {
  c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over'; c.filter = 'none';
  c.shadowBlur = 0; c.shadowColor = 'rgba(0,0,0,0)'; c.letterSpacing = '0px'; c.setLineDash([]); c.lineCap = 'butt'; c.lineJoin = 'miter';
}

// ======================================================================== 基础绘制
function font(size, weight = 500, fam = SERIF, style = '') { ctx.font = `${style} ${weight} ${size}px ${fam}`; }
function text(s, x, y, o = {}) {
  if ((o.alpha ?? 1) <= 0) return;
  ctx.save();
  font(o.size || 44, o.weight || 500, o.font || SERIF, o.style || '');
  ctx.textAlign = o.align || 'left'; ctx.textBaseline = o.base || 'middle';
  ctx.globalAlpha *= o.alpha ?? 1; ctx.letterSpacing = (o.ls || 0) + 'px';
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.blur ?? 20; }
  if (o.filter) ctx.filter = o.filter;
  ctx.fillStyle = o.color || CREAM; ctx.fillText(s, x, y);
  ctx.restore();
}
// 发光的点：外圈光晕 + 实心核
function glow(x, y, r, rgb, a = 1, halo = 5) {
  if (a <= 0 || r <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const R = r * halo, g = ctx.createRadialGradient(x, y, 0, x, y, R);
  g.addColorStop(0, `rgba(${rgb},${.55 * a})`); g.addColorStop(.25, `rgba(${rgb},${.18 * a})`); g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, R, 0, TAU); ctx.fill();
  ctx.restore();
  ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = `rgb(${rgb})`; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.restore();
}
function seg(x1, y1, x2, y2, col, lw = 2, a = 1) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore();
}

// ======================================================================== 文字：逐字浮现
// 「」里的字用高亮色
function runs(s) { const r = []; let hi = false; for (const ch of s) { if (ch === '「') { hi = true; continue; } if (ch === '」') { hi = false; continue; } r.push({ ch, hi }); } return r; }
function advances(rs, o) { font(o.size, o.weight || 500, o.font || SERIF, o.style || ''); ctx.letterSpacing = '0px'; return rs.map(c => ctx.measureText(c.ch).width + (o.ls || 0)); }
const runWidth = (rs, o) => advances(rs, o).reduce((a, b) => a + b, 0) - (o.ls || 0);
// p：0 → 1 的出现进度；每个字从模糊、偏下、透明变清晰，前后重叠 spread 个字
function typeRun(rs, x, y, o, p, alpha = 1) {
  if (alpha <= 0 || p <= 0) return;
  const adv = advances(rs, o), total = adv.reduce((a, b) => a + b, 0) - (o.ls || 0);
  let cx = o.align === 'center' ? x - total / 2 : o.align === 'right' ? x - total : x;
  const n = rs.length, sp = o.spread ?? 6;
  ctx.save(); ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.glowBlur ?? 24; }
  for (let i = 0; i < n; i++) {
    const e = E.out(clamp((p * (n + sp) - i) / sp));
    if (e > 0) {
      ctx.globalAlpha = alpha * e;
      const b = (1 - e) * (o.blur ?? 10);
      ctx.filter = b > .4 ? `blur(${b.toFixed(1)}px)` : 'none';
      ctx.fillStyle = rs[i].hi ? (o.hi || ORANGE) : (o.color || CREAM);
      ctx.fillText(rs[i].ch, cx, y + (1 - e) * (o.rise ?? 22));
    }
    cx += adv[i];
  }
  ctx.restore();
}
const typeText = (s, x, y, o, p, alpha) => typeRun(runs(s), x, y, o, p, alpha);

// 断行：放得下就一行；否则两行，优先在标点后断、取最均衡的位置；不拆英文单词和数字
const PUNCT = '，、：；。？！——…';
function wrapRuns(rs, o, max) {
  const wid = a => runWidth(a, o);
  if (wid(rs) <= max) return [rs];
  let best = -1, bd = 1e9;
  rs.forEach((c, i) => {
    if (!PUNCT.includes(c.ch) || i === rs.length - 1) return;
    const a = wid(rs.slice(0, i + 1)), b = wid(rs.slice(i + 1));
    if (a <= max && b <= max && Math.abs(a - b) < bd) { bd = Math.abs(a - b); best = i + 1; }
  });
  if (best < 0) rs.forEach((c, i) => {
    if (i === 0 || PUNCT.includes(c.ch) || /\w\w/.test(rs[i - 1].ch + c.ch)) return;
    const a = wid(rs.slice(0, i)), b = wid(rs.slice(i));
    if (a <= max && b <= max && Math.abs(a - b) < bd) { bd = Math.abs(a - b); best = i; }
  });
  return best > 0 ? [rs.slice(0, best), rs.slice(best)] : [rs];
}

// ======================================================================== 字幕（无配音，字幕就是旁白）
// 左下角衬线字，逐字浮现；离场时轻轻上浮淡出。位置避开 TikTok 底部文案和右侧按钮。
const NARR = { x: 96, y: 1436, lh: 68, max: 880, size: 46, weight: 500, font: SERIF, ls: 2, spread: 7, rise: 14, blur: 8 };
const WRAP_CACHE = new Map();
function narration(T) {
  let shade = 0;
  for (const [a, b] of LINES) shade = Math.max(shade, win(T, a - .4, b + .6, .5, .6));
  if (shade > 0) {
    const g = ctx.createLinearGradient(0, 1250, 0, 1620); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.5, `rgba(0,0,0,${.42 * shade})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 1250, W, 370);
  }
  LINES.forEach(([a, b, s], k) => {
    const next = LINES[k + 1] ? LINES[k + 1][0] : Infinity, fe = Math.max(b + .15, Math.min(b + .6, next - .05));   // 下一句开始之前淡出完，两句不叠在一起
    if (T < a || T > fe + .1) return;
    if (!WRAP_CACHE.has(s)) WRAP_CACHE.set(s, wrapRuns(runs(s), NARR, NARR.max));
    const lines = WRAP_CACHE.get(s);
    const fade = 1 - sstep(b, fe, T), drift = -16 * E.in(prog(T, b, fe + .1));
    const n = lines.reduce((k, l) => k + l.length, 0), dur = Math.min(1.2, .3 + n * .03);
    lines.forEach((ln, i) => {
      const t0 = a + i * .22;
      typeRun(ln, NARR.x, NARR.y + (i - (lines.length - 1)) * NARR.lh + drift, { ...NARR, glow: 'rgba(0,0,0,.9)', glowBlur: 14 }, prog(T, t0, t0 + dur), fade);
    });
  });
}

// ======================================================================== 右上角的年份 / 出处
function stamp(s, sub, t0, t1, T) {
  const a = win(T, t0, t1, .7, .7); if (a <= 0) return;
  const e = E.outExpo(prog(T, t0, t0 + 1.4));
  text(s, W - 96 + (1 - e) * 40, 412, { font: LAT, weight: 600, size: 56, align: 'right', alpha: a * .95, ls: 4 });
  if (sub) text(sub, W - 96 + (1 - e) * 70, 462, { font: LAT, style: 'italic', weight: 500, size: 29, align: 'right', color: DIM, alpha: a });
}

// ======================================================================== 顶部分段进度条
// 放在 TikTok 顶部“关注 / 推荐”栏之下（y = 336）。当前段落橙色，头部带一颗发光的点；段落名切换时上下交替。
const PB = { y: 336, x0: 96, x1: 984, gap: 12 };
function progress(T, a = 1) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a;
  const span = PB.x1 - PB.x0 - PB.gap * (SECTIONS.length - 1);
  let x = PB.x0, cur = 0;
  SECTIONS.forEach(([, s0, s1], i) => {
    const w = span * (s1 - s0) / TOTAL, f = clamp((T - s0) / (s1 - s0)); if (T >= s0) cur = i;
    ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fillRect(x, PB.y - 1, w, 2);
    if (f > 0) {
      ctx.fillStyle = f < 1 ? ORANGE : 'rgba(236,230,218,.7)'; ctx.fillRect(x, PB.y - 1, w * f, 2);
      if (f < 1) glow(x + w * f, PB.y, 3.2, O_RGB, 1, 5);
    }
    x += w + PB.gap;
  });
  SECTIONS.forEach(([name, s0], i) => {
    const s1 = SECTIONS[i + 1] ? SECTIONS[i + 1][1] : TOTAL + 9;
    const k = (i ? sstep(s0, s0 + .45, T) : 1) * (1 - sstep(s1 - .45, s1, T)); if (k <= 0) return;
    const e = i ? sstep(s0, s0 + .45, T) : 1, y = PB.y - 34 + (1 - e) * 10 - 10 * sstep(s1 - .45, s1, T);
    text(`${String(i + 1).padStart(2, '0')}   ${name}`, PB.x0, y, { size: 27, weight: 500, color: CREAM, alpha: .88 * k, ls: 4 });
  });
  text(`${String(cur + 1).padStart(2, '0')} / ${String(SECTIONS.length).padStart(2, '0')}`, PB.x1, PB.y - 34, { font: LAT, weight: 600, size: 30, color: DIM, align: 'right', ls: 2 });
  ctx.restore();
}

// ======================================================================== 水印
// 低透明度、缓慢漂移，活动范围避开进度条和字幕
const WM = '@黑猫不说话';
function watermark(T, a = 1) {
  const x = 540 + Math.sin(T * TAU / 47 + 1.1) * 210 + Math.sin(T * TAU / 83 + 1) * 50;
  const y = 860 + Math.sin(T * TAU / 61 + 1.3) * 300;
  text(WM, x, y, { font: SANS, weight: 500, size: 30, align: 'center', color: '#ffffff', alpha: .16 * a, ls: 2 });
}

// ======================================================================== 后期：泛光、暗角、颗粒
const GRAIN = (() => {
  const c = mk(256, 256), g = c.getContext('2d'), im = g.createImageData(256, 256), r = mulberry(3);
  for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0); return c;
})();
function bloom(k) {
  if (k <= 0) return;
  reset(BCTX); BCTX.globalCompositeOperation = 'copy'; BCTX.filter = 'brightness(.9) contrast(2.4) blur(5px)';
  BCTX.drawImage(cv, 0, 0, W / 4, H / 4);
  OUT.save(); OUT.globalCompositeOperation = 'screen'; OUT.globalAlpha = k; OUT.imageSmoothingQuality = 'high'; OUT.drawImage(BLOOM, 0, 0, W, H); OUT.restore();
}
// 暗、昏黄的调色（No.53 起频道主要的主色调）：把画好的一块区域拷出来，加滤镜（偏棕、降饱和、压暗）再画回去，
// 叠一层琥珀色（乘法：白的变成暖米色，暗部更暗），四周再压一圈暗角。只调画面（照片 + 人物），对话框和字不调。
const GRADE = mk(W, H), GCTX = GRADE.getContext('2d');
function warmGrade(x, y, w, h, k = 1, o = {}) {
  if (k <= 0) return;
  GCTX.setTransform(1, 0, 0, 1, 0, 0); GCTX.globalCompositeOperation = 'copy'; GCTX.filter = 'none'; GCTX.globalAlpha = 1;
  GCTX.drawImage(ctx.canvas, x, y, w, h, x, y, w, h);
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.globalAlpha = k; ctx.filter = `sepia(${o.sepia ?? .4}) saturate(${o.sat ?? .82}) brightness(${o.bright ?? .8}) contrast(${o.contrast ?? 1.06})`;
  ctx.drawImage(GRADE, x, y, w, h, x, y, w, h); ctx.filter = 'none';
  ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = o.tint || 'rgb(255,218,165)'; ctx.fillRect(x, y, w, h);
  ctx.globalCompositeOperation = 'source-over';
  const v = ctx.createRadialGradient(x + w / 2, y + h * .48, Math.min(w, h) * .35, x + w / 2, y + h * .48, Math.max(w, h) * .78);
  v.addColorStop(0, 'rgba(20,12,4,0)'); v.addColorStop(1, `rgba(20,12,4,${o.vig ?? .55})`); ctx.fillStyle = v; ctx.fillRect(x, y, w, h);
  ctx.restore();
}
function grade(T, vig = .62, grain = .07) {
  const v = ctx.createRadialGradient(W / 2, H * .46, H * .26, W / 2, H * .46, H * .82);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, `rgba(0,0,0,${vig})`); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  const f = Math.floor(T * FPS), ox = (f * 97) % 256, oy = (f * 61) % 256;
  ctx.save(); ctx.globalAlpha = grain; ctx.globalCompositeOperation = 'overlay';
  ctx.fillStyle = ctx.createPattern(GRAIN, 'repeat'); ctx.translate(-ox, -oy); ctx.fillRect(0, 0, W + 256, H + 256); ctx.restore();
}

// ======================================================================== 一帧
// 剧集提供：TOTAL、SECTIONS、LINES、CUES、INIT()、WORLD(t)、SAMPLES(T)、OVER(T)、MASTER(T)
function render(T) {
  T = clamp(T, 0, TOTAL - 1e-4);
  const n = Math.max(1, SAMPLES(T) | 0);
  reset(OUT);
  for (let k = 0; k < n; k++) {
    const t = n === 1 ? T : T + (k / (n - 1) - .5) * SHUTTER / FPS;
    ctx = n === 1 ? OUT : LCTX; reset(ctx); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    WORLD(t);
    if (n > 1) { reset(OUT); OUT.globalAlpha = 1 / (k + 1); OUT.drawImage(LAYER, 0, 0); }
  }
  ctx = OUT; reset(OUT);
  bloom(BLOOM_K(T)); reset(OUT);
  grade(T); reset(OUT);
  OVER(T); reset(OUT);
  narration(T); reset(OUT);
  const m = MASTER(T);
  watermark(T, m); if (SHOW_PROGRESS) progress(T, m); reset(OUT);
  const dark = sstep(TOTAL - .9, TOTAL, T);                         // 第一帧就是封面，不做淡入；结尾淡出接片尾
  if (dark > 0) { OUT.fillStyle = `rgba(0,0,0,${dark})`; OUT.fillRect(0, 0, W, H); }
}

const SHOW_PROGRESS = false;
// ======================================================================== No.54 把自己捡回来（Wojak 叙事短剧：主人公的独白）
// 照着频道主发来的参考视频做：频道主喜欢那条视频的分镜和运镜，不喜欢它最后选的办法（剪视频），这里换成“跑步”，台词都是重新写的。
//   上班以后最崩溃的一刻 → 一天（快切）→ 上学的时候（教室，泛黄）→ 窗前的剪影 → 身边的人都过得挺好 → 凌晨两点
//   → “对我来说，那个东西是——跑步。” → 第 1、7、30 天 → 回到开头的路口，他往前走了。
// 学参考视频的镜头：
//   - 大远景里一个人站着不动，身边的人一直往前走；大字一个个砸出来（不是加班 / 不是挨骂 / 麻木 / 听话）；
//   - 一个词一个镜头的快切，画面中间配细字（开 会 / 打 卡 / 写 周 报）；
//   - 窗前的剪影、仰拍的空镜（路灯）、脸的特写、手机屏幕的插入镜头；
//   - 字在人物身后（“跑步”两个大字，他站在字前面）；跟着人往后退的推轨（跑步）；首尾是同一个路口。
// 这一期是独白：主人公的画外音 + 画框下面的字幕，不出对话框。一场戏一张图；背景挑昏暗、昏黄的，人物不调色（剪影、回忆除外）。
// 没有片头、没有进度条，片尾和水印保留。
// ======================================================================== 时间轴（layout.py 生成，别手改）
const TOTAL = 136.0;
const SECTIONS = [['路口', 0.0, 17.6], ['一天', 17.6, 31.2], ['以前', 31.2, 36.8], ['办公室', 36.8, 44.8], ['身边', 44.8, 59.2], ['深夜', 59.2, 80.0], ['跑步', 80.0, 104.0], ['给你', 104.0, 136.0]];
const LINES = [];                                                   // 独白放在 DIALOG 里（kind = vo），字幕自己画

function hero(o, t) {
  const a = o.a ?? 1; if (a <= 0) return null;
  let s, x, y;
  if (o.feet != null) { s = o.hgt / (HERO.feet - HERO.top); x = o.cx - HERO.bx * s; y = o.feet - HERO.feet * s; }
  else { s = o.s ?? .652; x = o.cx - HERO.fx * s; y = o.top - HERO.top * s; }
  const [e, prev, k] = o.e ? [o.e, o.e, 1] : heroExpr(t);
  ctx.save(); ctx.globalAlpha *= a;
  if (o.feet != null) {                                                      // 脚下的影子
    ctx.save(); ctx.filter = `blur(${Math.max(2, o.hgt / 60).toFixed(1)}px)`; ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.beginPath(); ctx.ellipse(o.cx, o.feet - o.hgt * .005, o.hgt * .2, o.hgt * .028, 0, 0, TAU); ctx.fill(); ctx.restore();
  }
  if (o.rot) { const [px, py] = o.pivot; ctx.translate(px, py); ctx.rotate(o.rot); ctx.translate(-px, -py); }
  if (o.sil) ctx.filter = `brightness(0) drop-shadow(0 0 ${o.rim ?? 5}px rgba(255,150,80,${o.rimA ?? .55}))`;
  const base = ctx.globalAlpha;
  if (k < 1) ctx.drawImage(IMG['hero_' + prev], x, y, HERO.w * s, HERO.h * s);
  ctx.globalAlpha = base * (k < 1 ? k : 1); ctx.drawImage(IMG['hero_' + e], x, y, HERO.w * s, HERO.h * s);
  ctx.restore();

}

function passers(t, list) {
  for (const [t0, dir, i, h, spd] of list) {
    const u = t - t0; if (u < 0 || u > 2.5) continue;
    const im = IMG[WALKERS[i % WALKERS.length]]; if (!im.naturalWidth) continue;
    const w = h * im.naturalWidth / im.naturalHeight, x = (dir > 0 ? -w : FR.w) + dir * u * spd;
    if (x > FR.w || x + w < 0) continue;

    ctx.save(); ctx.filter = `brightness(0) blur(${Math.round(h / 75)}px)`; ctx.globalAlpha *= .95;
    if (dir < 0) { ctx.translate(x + w, y); ctx.scale(-1, 1); ctx.drawImage(im, 0, 0, w, h); } else ctx.drawImage(im, x, y, w, h);
    ctx.restore();

}

    // ⑥ 跑步：大字“跑步”在他身后 → 第 1 天（背心男轻轻松松超过他）→ 第 7 天 → 第 30 天 → 停下来，镜头推到脸上
    sh(S['跑步'], (t, u, d) => track(t, camLerp([CX, CY, 1.0], [CX, CY + 10, 1.08], E.io(u / d)), 1, () => { runWord(t); hero({ cx: CX, top: 900, s: .56 }, t); })),
    sh(D(34) - .05, (t, u, d) => track(t, [CX + handheld(t, 4)[0], CY + handheld(t, 4)[1], 1.02], lerp(1.38, 1.0, u / d), () => {
      const r = runner(t, 600, 800, 2.4, 22, null); if (r) sweat(t, r.face, 5, 7); overtake(t); })),
    sh(D(36) - .05, (t, u, d) => track(t, [CX + handheld(t, 4)[0], CY + handheld(t, 4)[1], 1.02], lerp(1.32, 1.0, u / d), () => {
      const r = runner(t, 420, 800, 2.7, 15, null); if (r) sweat(t, r.face, 2, 9); })),
    sh(D(37) - .05, (t, u, d) => track(t, [CX + handheld(t, 4)[0], CY + handheld(t, 4)[1], 1.02], lerp(1.45, 1.0, u / d), () => runner(t, 560, 820, 3.0, 12, null))),
    sh(D(38) - .05, (t, u, d) => track(t, camLerp([CX, 1000, 1.05], [CX, 1035, 2.0], E.io(prog(t, D(38) + .2, DE(39) + 1.2))), 1, () => {
      const br = 1 + .008 * Math.sin(t * 5.5) * (1 - sstep(D(38), DE(39) + 1.5, t) * .6);       // 还在喘
      ctx.save(); ctx.translate(CX, FB); ctx.scale(1, br); ctx.translate(-CX, -FB); hero({ cx: CX, top: 820 }, t); ctx.restore(); })),
    // ⑦ 给你：回到开头的路口 → 中景 → 大远景 → 他往前走了
    sh(S['给你'], (t, u, d) => crosswalk(t, camLerp([CX, CY, 1.0], [CX, CY + 10, 1.05], E.io(u / d)), STAND)),
    sh(D(44) - .05, (t, u, d) => crosswalk(t, camLerp([CX, 1010, 2.05], [CX, 985, 2.35], E.io(u / d)), STAND)),
    sh(D(48) - .05, (t, u, d) => crosswalk(t, camLerp([CX, CY, 1.0], [CX, CY, 1.03], E.io(u / d)), STAND)),
    sh(D(49) - .05, (t, u) => {
      const k = E.ioSine(prog(t, D(49) + .3, D(49) + 8.5)), hgt = lerp(400, 1150, k), feet = lerp(1290, 1820, k);
      const step = Math.abs(Math.sin(t * 5.6)) * (k > 0 && k < 1 ? 1 : 0);
      crosswalk(t, [CX, CY, 1.0], { cx: CX + 6 * Math.sin(t * 2.8), feet: feet - step * hgt * .012, hgt });
    }),
  ];
  SHOTS.forEach((s, i) => { s.t1 = i + 1 < SHOTS.length ? SHOTS[i + 1].t0 : TOTAL + 1; });
}
// 会议室：领导在讲（翻过来面对他），他在左边发呆
function meeting(t, u, d) {
  frame(camLerp([CX, CY, 1.02], [CX, CY, 1.07], E.io(u / Math.max(d, .1))), () => {
    photo('meeting'); cast('领导', { cx: 870, w: 500, flip: true, dy: -5 * Math.abs(Math.sin(t * 7)) }); hero({ cx: 340, top: 810, e: 'meh' }, t);
  });
}
// 下班：挤在人群里往前走（路口，镜头拉近）
function commute(t, u) {
  crosswalk(t, [380, 1120, 1.7], { cx: 300 + 160 * u, feet: 1300 - 6 * Math.abs(Math.sin(t * 6)), hgt: 420, e: 'meh' });
}
// 躺下：一头栽到床上
function flop(t, u) {
  const k = E.in(prog(u, .3, .62));
  bedroom(t, [CX, CY, 1.0], 1, { cx: 760, top: 790, e: 'meh', rot: 1.45 * k, pivot: [900, FB + 520] }, 0);
}
// 快放：一天再来一遍（每个镜头只给一眨眼）
const REPLAY_SEQ = [3, 4, 5, 6, 7, 8];
function replay(t, u) {
  const per = .22, i = Math.floor(u / per);
  if (i >= REPLAY_SEQ.length) return;                                       // 放完就黑着，等着进下一段
  const s = SHOTS[REPLAY_SEQ[i]], tf = s.t0 + (u - i * per) * 2.2;
  s.f(tf, tf - s.t0, s.t1 - s.t0);
}
// 教室黑板上的倒计时（粉笔字）
function chalk(t) {
  ctx.save(); ctx.translate(705, 770); ctx.rotate(-.02);
  for (const [dx, dy, a] of [[0, 0, .78], [1.2, .8, .25], [-1, .6, .2]]) {
    text('距离高考还有', -150 + dx, -70 + dy, { font: SANS, size: 50, weight: 500, align: 'center', color: '#f2efe4', alpha: a, ls: 6, filter: 'blur(.6px)' });
    text('100', -60 + dx, 50 + dy, { font: SANS, size: 128, weight: 700, align: 'center', color: '#f6e7b8', alpha: a, filter: 'blur(.6px)' });
    text('天', 80 + dx, 70 + dy, { font: SANS, size: 60, weight: 500, align: 'center', color: '#f2efe4', alpha: a, filter: 'blur(.6px)' });
  }
  ctx.restore();
}
function memoryLook(t) {                                                    // 回忆：整体泛黄、颗粒、轻轻闪
  warmGrade(FR.x, FR.y, FR.w, FR.h, 1, { sepia: .55, sat: .72, bright: .92, contrast: 1.04, tint: 'rgb(255,226,182)', vig: .6 });
  ctx.save(); ctx.beginPath(); ctx.rect(FR.x, FR.y, FR.w, FR.h); ctx.clip();
  ctx.fillStyle = `rgba(0,0,0,${.04 + .03 * Math.sin(t * 23) * Math.sin(t * 7.1)})`; ctx.fillRect(FR.x, FR.y, FR.w, FR.h);
  const r = mulberry(Math.floor(t * 12)); ctx.fillStyle = 'rgba(255,240,215,.55)';
  for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.arc(r() * W, FR.y + r() * FR.h, .8 + r() * 1.8, 0, TAU); ctx.fill(); }
  if (r() < .35) { const x = r() * W; ctx.fillStyle = 'rgba(255,240,215,.12)'; ctx.fillRect(x, FR.y, 1.5, FR.h); }
  ctx.restore();
}
const FLASH = () => .75;                                                    // 运营自拍：闪光灯
// “跑步”两个大字：在他身后，一下砸下来
function runWord(t) {
  const a = D(33) + .02, k = E.outQuint(prog(t, a, a + .35)), al = sstep(a, a + .05, t); if (al <= 0) return;
  ctx.save(); ctx.translate(CX, FR.y + 400); const sc = 1.3 - .3 * k; ctx.scale(sc, sc);
  text('跑步', 26, 0, { font: SERIF, size: 330, weight: 900, align: 'center', color: '#f3eee6', alpha: al * .96, ls: 52, glow: 'rgba(255,255,255,.25)', blur: 30 });
  ctx.restore();
}
// 第一天：背心男从旁边跑上来，轻轻松松超过他（越跑越近，出了画）
function overtake(t) {
  const a = D(35) - .2, u = t - a; if (u < 0 || u > 2.6) return;
  const k1 = E.out(clamp(u / .7)), k2 = E.io(clamp((u - .9) / 1.1));
  cast('背心男', { cx: lerp(-150, 210, k1) - 520 * k2, w: lerp(470, 980, k2), dy: -12 * Math.abs(Math.sin(u * 8.2)) });
}

// ======================================================================== 黑场：[黑到底, 开始亮, 淡出用时, 淡入用时]
const BLACKS = () => [
  [REPLAY() + REPLAY_SEQ.length * .22, S['以前'], .12, .7],
  [S['办公室'] - .2, S['办公室'] + .02, .6, .6],
  [S['身边'] - .2, S['身边'] + .02, .5, .6],
  [S['深夜'] - .2, S['深夜'] + .02, .5, .8],
  [BLACK_RUN(), S['跑步'], .2, .01],
  [S['给你'] - .3, S['给你'] + .02, .9, .8],
];
function blacks(t) {
  let b = 0; for (const [a, z, fo, fi] of BLACKS()) b = Math.max(b, sstep(a - fo, a, t) * (1 - sstep(z, z + fi, t)));
  if (b > 0) { ctx.save(); ctx.globalAlpha = b; ctx.fillStyle = '#000'; ctx.fillRect(FR.x - 2, FR.y - 2, FR.w + 4, FR.h + 4); ctx.restore(); }
}

// ======================================================================== 世界层
function WORLD(t) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const i = Math.max(0, SHOTS.findIndex((s, k) => t >= s.t0 && t < s.t1)), sh = SHOTS[i];
  sh.f(t, t - sh.t0, sh.t1 - sh.t0);
  if (sh.word) thinWord(sh.word, t, sh.w0 ? sh.w0() : sh.t0 + .08, sh.t1, ...(sh.wp || [CX, CY]));
  blacks(t);
  ctx.save(); ctx.strokeStyle = 'rgba(236,230,218,.10)'; ctx.lineWidth = 2; ctx.strokeRect(FR.x - 1, FR.y - 1, FR.w + 2, FR.h + 2); ctx.restore();
  bigWords(t);
  dayLabel(t, D(34) - .05, D(36) - .1, 1, '800 米');
  dayLabel(t, D(36) - .05, D(37) - .1, 7, '2 公里');
  dayLabel(t, D(37) - .05, D(38) - .1, 30, '5 公里');
  subtitles(t);
  // 画框上面的黑边：开头是封面钩子；之后换成标题
  const L = S['一天'], hook = 1 - sstep(L - .9, L - .2, t), ttl = sstep(L + .5, L + 1.3, t);
  text('上班以后，', CX, 262, { size: 62, weight: 900, align: 'center', color: CREAM, alpha: hook });
  text('我最崩溃的一刻……', CX, 366, { size: 68, weight: 900, align: 'center', color: GOLD, alpha: hook });
  text('把自己捡回来', CX, 296, { font: SERIF, size: 60, weight: 900, align: 'center', color: GOLD, alpha: ttl, ls: 6 });
  text('给最近有点麻木的你', CX, 372, { font: SANS, size: 34, weight: 700, align: 'center', color: CREAM, alpha: ttl * .85, ls: 2 });
  // 最后的字卡（画框下面，字幕说完以后）
  const c1 = win(t, CARDS_AT, CARDS_AT + 3.6, .5, .5), c2 = sstep(CARDS_AT + 3.4, CARDS_AT + 4.0, t);
  typeText('你是不是也有一段时间，', CX, 1530, { ...BIGO, size: 52, weight: 900, color: CREAM }, prog(t, CARDS_AT, CARDS_AT + 1.0), c1);
  typeText('觉得自己正在变得麻木？', CX, 1622, { ...BIGO, size: 56, weight: 900, color: GOLD, glow: `rgba(${O_RGB},.5)`, glowBlur: 26 }, prog(t, CARDS_AT + 1.0, CARDS_AT + 2.2), c1);
  typeText('评论区说说：', CX, 1530, { size: 44, weight: 700, font: SERIF, align: 'center', color: CREAM, spread: 4 }, prog(t, CARDS_AT + 3.5, CARDS_AT + 4.0), c2);
  typeText('你最近在坚持的一件小事是什么？', CX, 1620, { size: 50, weight: 900, font: SERIF, align: 'center', color: GOLD, spread: 5, glow: `rgba(${O_RGB},.4)`, glowBlur: 16 }, prog(t, CARDS_AT + 3.9, CARDS_AT + 5.0), c2);
}
const BIGO = { align: 'center', spread: 3, blur: 14, rise: 18 };
function SAMPLES(T) { return 2; }
function BLOOM_K(T) { return T >= S['跑步'] && T < S['给你'] ? .3 : .18; }      // 操场的灯泛一点光
function OVER(T) {}
function MASTER(T) { return 1; }

// ======================================================================== 音效提示表
function CUES() {
  const c = [], A = (t, kind, o) => c.push([t, kind, o]);
  const walkW = i => { const im = IMG[WALKERS[i % WALKERS.length]]; return im.naturalWidth / im.naturalHeight; };
  // ① 路口：街上的人声和车流；路人从镜头前走过去：呼的一声 + 几步脚步；大字砸出来：闷闷的一下
  A(0, 'crowd', { dur: S['一天'] + .2, gain: .9, fi: .15, fo: .3 }); A(6.4, 'honk', { gain: .05, pan: -.5 });
  for (const [t0, dir, i, h, spd] of PASS()) {
    const mid = t0 + (FR.w / 2 + h * walkW(i) / 2) / spd;                         // 走到画面中间的时间
    A(mid - .4, 'whoosh', { dur: .8, gain: .06, dir });
    for (let k = -2; k <= 1; k++) A(mid + k * .29, 'step', { gain: .16, pan: dir * k * .3 });
  }
  for (const [a] of BIG()) A(a, 'thud', { gain: .32 });
  // ② 一天：每切一个镜头，钟“嗒”一下；每个镜头里自己的声音
  for (let i = 3; i <= 11; i++) A(SHOTS[i].t0, 'tick', { gain: .07 });
  A(S['一天'], 'room', { dur: D(12) - S['一天'], gain: .8, fi: .1, fo: .1 });
  A(D(9) - .05 + .3, 'ding', { gain: .22, f: 1568, pan: .2 });                                     // 打卡成功
  for (let k = 0; k < 9; k++) A(D(10) + .05 + k * .09, 'pop', { f: 1500 + (k % 3) * 120, gain: .35 });   // 敲键盘
  { const d = SHOTS[6].t1 - SHOTS[6].t0, per = Math.max(.08, (d - .3) / OK_MSGS.length);           // 群消息一条条进来
    for (let j = 1; j < OK_MSGS.length && j * per < d; j++) A(SHOTS[6].t0 + j * per, 'pop', { f: OK_MSGS[j][0] === 'me' ? 1200 : 850, gain: .22 }); }
  A(D(12) - .05, 'crowd', { dur: D(13) - D(12) + .1, gain: .9, fi: .05, fo: .1 });
  for (let k = 0; k < 3; k++) A(D(12) + k * .3, 'step', { gain: .14, pan: -.1 });
  A(D(13) - .05 + .62, 'flop', { gain: .9 });                                                      // 一头栽到床上
  for (let k = 0; k < 4; k++) A(D(14) + .05 + .32 * k, 'swish', { dur: .25, gain: .05 });           // 往上划
  A(D(15) - .05 + .3, 'click', { gain: .7 });                                                     // 关灯
  A(D(16) - .1, 'alarm', { dur: 1.0, gain: .9 });
  for (let k = 0; k < REPLAY_SEQ.length; k++) { A(REPLAY() + k * .22, 'swish', { dur: .2, gain: .06 }); A(REPLAY() + k * .22, 'tick', { gain: .08 }); }
  // ③ 教室：傍晚，远处有鸟叫；办公室：空调的嗡嗡声
  A(S['以前'], 'birds', { dur: S['办公室'] - S['以前'], gain: .05 }); A(S['以前'], 'wind', { dur: S['办公室'] - S['以前'], gain: .03 });
  A(S['办公室'] - .1, 'room', { dur: S['身边'] - S['办公室'], gain: .9, fi: .6, fo: .5 });
  // ④ 路灯：风、远处的车流；老哥打游戏；运营自拍；朋友圈往上翻
  A(S['身边'], 'night', { dur: D(23) - S['身边'], gain: 1.0, fi: .6, fo: .15 }); A(S['身边'], 'wind', { dur: D(23) - S['身边'], gain: .05 });
  A(D(23) - .05, 'room', { dur: S['深夜'] - D(23), gain: .8, fi: .05, fo: .4 });
  A(D(23) - .05, 'game', { dur: D(24) - D(23), gain: .3 });
  A(D(24) - .05 + FLASH(), 'shutter', { gain: .8 });
  A(D(25) + 1.9, 'swish', { dur: .5, gain: .05 });
  // ⑤ 深夜：屋里很静，钟滴答滴答；台灯“咔哒”亮了
  A(S['深夜'] - .1, 'room', { dur: BLACK_RUN() - S['深夜'] + .1, gain: .7, fi: .8, fo: .2 });
  for (let t = S['深夜'] + .5; t < BLACK_RUN() - .2; t += 1.0) A(t, 'tick', { gain: .022 });
  A(LAMP_ON(), 'click', { gain: .75 });
  // ⑥ 跑步：“跑步”砸下来；操场上有风，灯在嗡嗡响；脚步和喘气（脚落地 = 身体颠到最低的时候）
  A(D(33) + .02, 'boom', { gain: .32 });
  A(S['跑步'], 'wind', { dur: S['给你'] - S['跑步'], gain: .05 }); A(S['跑步'], 'room', { dur: S['给你'] - S['跑步'], gain: .45, fi: .1, fo: 1.5 });
  for (const [a, b, cad, heavy] of [[D(34) - .05, D(36) - .05, 2.4, .9], [D(36) - .05, D(37) - .05, 2.7, .5], [D(37) - .05, D(38) - .05, 3.0, .3]]) {
    for (let k = Math.ceil(a * cad); k / cad < b; k++) A(k / cad, 'step', { surface: 'track', gain: .2, pan: k % 2 ? .15 : -.15 });
    for (let t = a + .1; t < b - .3; t += 2 / cad) A(t, 'breath', { dur: 2 / cad, heavy, gain: .5 * (.6 + .4 * heavy) });
  }
  { const a = D(35) - .2; for (let u = .1; u < 2.3; u += PI / 8.2) A(a + u, 'step', { surface: 'track', gain: .16, pan: -.4 });   // 背心男
    A(a + 1.2, 'whoosh', { dur: .7, gain: .05, dir: -1 }); }
  { let t = D(38) - .05 + .1, gap = .8; for (let k = 0; t < D(38) + 6.5; k++) { A(t, 'breath', { dur: gap, heavy: Math.max(.15, .8 - k * .1), gain: .45 * Math.max(.3, 1 - k * .1) }); t += gap; gap = Math.min(1.5, gap + .1); } }
  // ⑦ 给你：回到路口；最后他往前走（脚步跟着身体颠）
  A(S['给你'] - .2, 'crowd', { dur: TOTAL - S['给你'] + .2, gain: .9, fi: .9, fo: 1.5 });
  for (let k = Math.ceil((D(49) + .4) * 5.6 / PI); k * PI / 5.6 < D(49) + 8.4; k++) A(k * PI / 5.6, 'step', { gain: .13, pan: k % 2 ? .1 : -.1 });
  A(CARDS_AT, 'shimmer', { f: [1046.5, 1318.5, 1568, 2093], gain: .05 });
  return c.sort((a, b) => a[0] - b[0]);
}

// ======================================================================== 字体、播放与导出接口
let fontsReady = false;
Promise.all([['900', SERIF], ['700', SERIF], ['500', SERIF], ['700', SANS], ['500', SANS], ['italic 500', LAT], ['italic 600', LAT], ['600', LAT]]
  .map(([w, f]) => document.fonts.load(`${w} 40px ${f}`, '把自己捡回来 Aa')))
  .then(() => document.fonts.ready).then(() => { INIT(); fontsReady = true; render(0); });
window.__ready = () => fontsReady && (typeof ASSETS_READY !== 'function' || ASSETS_READY());   // 照片这类素材（No.50 起）也要加载完
window.__frame = (t, q = .95) => { render(t); return cv.toDataURL('image/jpeg', q); };
window.__duration = () => TOTAL;
window.__cues = () => ({ total: TOTAL, cues: typeof CUES === 'function' ? CUES() : CUES, sections: SECTIONS.map(([name, t0, t1]) => ({ name, t0, t1 })) });

if (!EXPORT) {
  const au = new Audio('audio.wav');
  let playing = false, clock0 = 0, pausedAt = 0, useAudio = true;
  const now = () => useAudio && !au.paused ? au.currentTime : playing ? (performance.now() - clock0) / 1000 : pausedAt;
  function loop() { if (!playing) return; const T = now(); render(T); if (T >= TOTAL) { playing = false; pausedAt = 0; au.pause(); return; } requestAnimationFrame(loop); }
  function play() { playing = true; clock0 = performance.now() - pausedAt * 1000; au.currentTime = pausedAt; au.play().catch(() => { useAudio = false; }); requestAnimationFrame(loop); }
  function pause() { pausedAt = now(); playing = false; au.pause(); }
  document.getElementById('stage').onclick = () => playing ? pause() : play();
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { const t = clamp(now() + (e.code === 'ArrowRight' ? 5 : -5), 0, TOTAL); pausedAt = t; clock0 = performance.now() - t * 1000; au.currentTime = t; if (!playing) render(t); }
  });
} else document.getElementById('hint').remove();
</script>
