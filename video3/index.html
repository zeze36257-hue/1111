<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>忽冷忽热</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root { --bg: #000; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  canvas { height: 100vh; width: 56.25vh; max-width: 100vw; max-height: 177.78vw; background: #000; display: block; }
  #hint { position: fixed; left: 0; right: 0; bottom: 16px; text-align: center; color: #888; font: 14px "Noto Sans SC", sans-serif; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1080" height="1920"></canvas></div>
<div id="hint">点击播放 / 暂停 · ← → 快退快进</div>
<script>
'use strict';
// 《忽冷忽热》：间歇性强化。沿用第二版的风格——俯视与留白、数字叙事、节奏卡在背景音乐的段落上。
// 每一帧都是时间 T 的纯函数：实时预览与逐帧导出（?export=1）画出的是同一帧。
const W = 1080, H = 1920;
const EXPORT = /[?&]export=1/.test(location.search);
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const PI = Math.PI, TAU = PI * 2;
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const eout = t => 1 - Math.pow(1 - clamp(t), 3);
const eio = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const win = (t, a, b, fi = .4, fo = .4) => sstep(a, a + fi, t) * (1 - sstep(b - fo, b, t));
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const SERIF = '"Noto Serif SC", serif', SANS = '"Noto Sans SC", sans-serif', LAT = '"Cormorant Garamond", serif';
const ORANGE = '#f2a14a', TEAL = '#4fd6c4', CREAM = '#ece6da', DIM = '#8a93a3';
const O_RGB = '242,161,74', T_RGB = '79,214,196';

// 背景音乐的段落（秒）：前奏 0–10.5，安静 10.5–17.25，全编制 17.25 起，89.5 回落
const DROP = 17.25, CALM = 89.5;

// ======================================================================== 基础绘制
function text(s, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.style || ''} ${o.weight || 500} ${o.size || 44}px ${o.font || SERIF}`;
  ctx.textAlign = o.align || 'left'; ctx.textBaseline = o.base || 'middle';
  ctx.globalAlpha *= o.alpha ?? 1; ctx.letterSpacing = (o.ls || 0) + 'px';
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.blur ?? 20; }
  ctx.fillStyle = o.color || CREAM; ctx.fillText(s, x, y);
  ctx.restore();
}
function rr(x, y, w, h, r, fill, stroke, lw = 2) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function floor(c0 = '#161d29', c1 = '#07090d', cx = W / 2, cy = H * .45) {
  const g = ctx.createRadialGradient(cx, cy, 60, cx, cy, H * .85);
  g.addColorStop(0, c0); g.addColorStop(1, c1); ctx.fillStyle = g; ctx.fillRect(-W, -H, W * 3, H * 3);
}
function tiles(x0, y0, w, h, step, col = 'rgba(150,170,210,.05)') {
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 1.5;
  for (let x = x0; x <= x0 + w + .1; x += step) { ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y0 + h); ctx.stroke(); }
  for (let y = y0; y <= y0 + h + .1; y += step) { ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x0 + w, y); ctx.stroke(); }
  ctx.restore();
}
// 从正上方看到的一圈光
function pool(x, y, r, a, col = '255,222,170', edge = true) {
  if (a <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${col},${.34 * a})`); g.addColorStop(.7, `rgba(${col},${.16 * a})`); g.addColorStop(1, `rgba(${col},0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  if (edge) { ctx.strokeStyle = `rgba(${col},${.12 * a})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, r * .78, 0, TAU); ctx.stroke(); }
  ctx.restore();
}
// 俯视的人：肩膀 + 头顶。dir 是面朝方向（弧度，-PI/2 为朝上）
function human(x, y, s, o = {}) {
  const a = o.alpha ?? 1; if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.rotate((o.dir ?? -PI / 2) + PI / 2);
  if (o.phone) {                                     // 手机的光照亮脸前
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(0, -s * .9, 0, 0, -s * .9, s * 1.6);
    g.addColorStop(0, `rgba(150,200,255,${.35 * o.phone})`); g.addColorStop(1, 'rgba(150,200,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, -s * .9, s * 1.6, 0, TAU); ctx.fill(); ctx.restore();
  }
  const body = o.body || '#2a303c';
  ctx.fillStyle = body; ctx.beginPath(); ctx.ellipse(0, s * .32, s * 1.12, s * .6, 0, 0, TAU); ctx.fill();
  const sh = ctx.createLinearGradient(-s, 0, s, 0); sh.addColorStop(0, 'rgba(255,255,255,.08)'); sh.addColorStop(1, 'rgba(0,0,0,.25)');
  ctx.fillStyle = sh; ctx.beginPath(); ctx.ellipse(0, s * .32, s * 1.12, s * .6, 0, 0, TAU); ctx.fill();
  if (o.phone) rr(-s * .22, -s * 1.25, s * .44, s * .62, s * .08, `rgba(200,230,255,${.9 * o.phone})`);
  ctx.fillStyle = o.hair || '#0c0e13'; ctx.beginPath(); ctx.arc(0, 0, s * .52, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = s * .08; ctx.beginPath(); ctx.arc(0, 0, s * .44, PI * 1.1, PI * 1.6); ctx.stroke();
  ctx.restore();
  if (o.ring) {                                      // 主角 / 被标记的人：头顶一圈彩色光环
    ctx.save(); ctx.globalAlpha *= a * (o.ringA ?? 1);
    ctx.shadowColor = o.ring; ctx.shadowBlur = 16; ctx.strokeStyle = o.ring; ctx.lineWidth = Math.max(2.5, s * .1);
    ctx.beginPath(); ctx.arc(x, y, s * .78, 0, TAU); ctx.stroke(); ctx.restore();
  }
}
// 注释标签：从目标点引一条细线到文字，可带大号数字
function callout(x, y, dx, dy, a, big, small, col = CREAM, o = {}) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a;
  const k = eout(o.grow ?? 1);
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.globalAlpha *= .8;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + dx * k, y + dy * k); ctx.lineTo(x + dx * k + Math.sign(dx || 1) * 40 * k, y + dy * k); ctx.stroke();
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, 5, 0, TAU); ctx.fill();
  ctx.restore();
  const tx = x + dx + Math.sign(dx || 1) * 56, al = dx >= 0 ? 'left' : 'right';
  ctx.save(); ctx.globalAlpha *= a * sstep(.5, 1, o.grow ?? 1);
  ctx.font = `700 ${o.bigSize || 64}px ${SERIF}`; ctx.letterSpacing = '0px';
  const bw = big ? ctx.measureText(big).width : 0;
  if (big) text(big, tx, y + dy, { size: o.bigSize || 64, weight: 700, color: col, align: al });
  if (small) text(small, dx >= 0 ? tx + bw + (big ? 14 : 0) : tx - bw - (big ? 14 : 0), y + dy + (big ? 6 : 0), { size: 34, weight: 500, color: o.smallCol || CREAM, align: al });
  ctx.restore();
}
// 右上角的时间 / 年份标签（参考视频里的 2018、2020…）
function stamp(s, a, sub) {
  if (a <= 0) return;
  text(s, W - 96, 412, { font: LAT, weight: 600, size: 54, color: CREAM, align: 'right', alpha: a * .9, ls: 4 });
  if (sub) text(sub, W - 96, 460, { font: LAT, style: 'italic', weight: 500, size: 30, color: DIM, align: 'right', alpha: a });
}
const BOKEH = (() => { const r = mulberry(4); return Array.from({ length: 26 }, () => ({ x: r() * W, y: 300 + r() * 1300, r: 20 + r() * 50, p: r() * TAU, v: .2 + r() * .5 })); })();
function bokeh(t, a) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const b of BOKEH) {
    const al = a * (.04 + .04 * Math.sin(t * b.v + b.p)), y = b.y - t * 8 * b.v;
    const g = ctx.createRadialGradient(b.x, y, 0, b.x, y, b.r); g.addColorStop(0, `rgba(160,190,230,${al})`); g.addColorStop(1, 'rgba(160,190,230,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, y, b.r, 0, TAU); ctx.fill();
  }
  ctx.restore();
}
const GRAIN = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'), im = g.createImageData(256, 256), r = mulberry(3);
  for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0); return c;
})();
function post(T) {
  const v = ctx.createRadialGradient(W / 2, H * .46, H * .28, W / 2, H * .46, H * .8);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.6)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  const f = Math.floor(T * 30), ox = (f * 97) % 256, oy = (f * 61) % 256;
  ctx.save(); ctx.globalAlpha = .06; ctx.globalCompositeOperation = 'overlay';
  ctx.fillStyle = ctx.createPattern(GRAIN, 'repeat'); ctx.translate(-ox, -oy); ctx.fillRect(0, 0, W + 256, H + 256); ctx.restore();
}

// ======================================================================== 共用场景元素
function heartPath(x, y, s) {
  ctx.beginPath(); ctx.moveTo(x, y + s * .35);
  ctx.bezierCurveTo(x - s * .9, y - s * .25, x - s * .45, y - s * .85, x, y - s * .38);
  ctx.bezierCurveTo(x + s * .45, y - s * .85, x + s * .9, y - s * .25, x, y + s * .35); ctx.closePath();
}
// 聊天气泡：side 'L' 是 TA（左），'R' 是你（右）
function bubble(s, x, y, side, a, o = {}) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a;
  ctx.font = `500 40px ${SANS}`; ctx.letterSpacing = '0px';
  const w = ctx.measureText(s).width + 64, h = 86, bx = side === 'R' ? x - w : x, dy = (1 - eout(o.pop ?? 1)) * 20;
  rr(bx, y - h / 2 + dy, w, h, 30, side === 'R' ? 'rgba(242,161,74,.92)' : 'rgba(46,54,70,.96)');
  text(s, bx + 32, y + 2 + dy, { font: SANS, size: 40, color: side === 'R' ? '#21140a' : CREAM });
  if (o.time) text(o.time, x, y + h / 2 + 26 + dy, { font: SANS, size: 24, color: DIM, align: side === 'R' ? 'right' : 'left' });
  if (o.tag) text(o.tag, side === 'R' ? bx - 18 : bx + w + 18, y + h / 2 - 12 + dy, { font: SANS, size: 26, color: o.tagCol || TEAL, align: side === 'R' ? 'right' : 'left', alpha: o.tagA ?? 1 });
  ctx.restore();
}
function avatar(x, y, r, ring = TEAL) {
  ctx.save(); ctx.fillStyle = '#2b3242'; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.fillStyle = '#c9d0de'; ctx.beginPath(); ctx.arc(x, y - r * .18, r * .34, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x, y + r * .62, r * .62, r * .42, 0, PI, TAU); ctx.fill();
  ctx.shadowColor = ring; ctx.shadowBlur = 12; ctx.strokeStyle = ring; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, r + 5, 0, TAU); ctx.stroke();
  ctx.restore();
}
function chatHeader(a, status = '') {
  ctx.save(); ctx.globalAlpha *= a;
  avatar(160, 500, 34);
  text('TA', 220, 488, { font: SANS, weight: 700, size: 38, color: CREAM });
  if (status) text(status, 220, 528, { font: SANS, size: 24, color: DIM });
  ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fillRect(90, 572, 900, 2);
  ctx.restore();
}
const pad2 = n => String(Math.floor(n)).padStart(2, '0');

// ======================================================================== 镜头
const SHOTS = [];
function shot(o) { SHOTS.push(o); return o; }

// ---------------------------------------------------------------- 0–10.5 三个小时没回，第 27 次打开对话框
const REOPEN = [5.6, 6.8, 8.0];
shot({
  t0: 0, t1: 10.5, fi: .01,
  draw(lt, d, T) {
    floor('#121824', '#05070a'); bokeh(T, .8);
    chatHeader(1);
    bubble('今天好累', 110, 660, 'L', 1, { time: '20:31' });
    bubble('抱抱，早点休息～', 970, 800, 'R', 1, { time: '20:32' });
    bubble('到家了吗？', 970, 940, 'R', 1, { time: '21:04', tag: '已读' });
    const sec = 3 * 3600 - 2 + Math.max(0, lt - 1);              // 02:59:58 起，一秒一秒地走
    text('已等待', W / 2, 1110, { font: SANS, size: 30, color: DIM, align: 'center', alpha: sstep(.6, 1.2, lt), ls: 6 });
    const cross = sstep(3, 3.4, lt) * (1 - sstep(3.4, 4.6, lt));
    text(`${pad2(sec / 3600)}:${pad2((sec % 3600) / 60)}:${pad2(sec % 60)}`, W / 2, 1185, { weight: 700, size: 92, align: 'center', color: sec >= 10800 ? ORANGE : CREAM, alpha: sstep(.6, 1.2, lt), ls: 6, glow: `rgba(${O_RGB},${.6 * cross})`, blur: 30 });
    const n = 24 + REOPEN.filter(f => lt >= f).length;
    stamp(`第 ${n} 次`, sstep(4.8, 5.3, lt), '打开对话框');
    const flash = Math.max(0, ...REOPEN.map(f => 1 - Math.abs(lt - f) / .16));
    if (flash > 0) { ctx.fillStyle = `rgba(0,0,0,${flash * .9})`; ctx.fillRect(-W, -H, W * 3, H * 3); }
  },
});
// ---------------------------------------------------------------- 10.5–17.25 标题
function tempLine(y, t, amp, a, calm = 0) {     // 一条忽冷忽热的“温度线”：热的段落是橙色，冷的段落是青色
  ctx.save(); ctx.lineWidth = 3; ctx.lineCap = 'round';
  let px = null, py = null;
  for (let x = -20; x <= W + 20; x += 6) {
    const v = Math.sin(x * .011 + t * .9) * .55 + Math.sin(x * .029 - t * 1.7) * .3 + Math.sin(x * .061 + t * 2.3) * .15;
    const vv = lerp(v, Math.sin(x * .012 + t * .8) * .35, calm), yy = y - vv * amp;
    if (px !== null) {
      const k = clamp(vv * .9 + .5);
      ctx.strokeStyle = `rgba(${Math.round(lerp(79, 242, k))},${Math.round(lerp(214, 161, k))},${Math.round(lerp(196, 74, k))},${a})`;
      ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x, yy); ctx.stroke();
    }
    px = x; py = yy;
  }
  ctx.restore();
}
shot({
  t0: 10.5, t1: DROP,
  draw(lt, d, T) {
    floor('#121925', '#05070a');
    const cols = [CREAM, TEAL, CREAM, ORANGE];
    [...'忽冷忽热'].forEach((ch, i) => {
      const a = sstep(1 + i * .25, 2 + i * .25, lt), flick = .75 + .25 * Math.sin(lt * (3 + i) + i * 2);
      text(ch, 540 + (i - 1.5) * 170, 640, { size: 150, weight: 900, align: 'center', color: cols[i], alpha: a * (i % 2 ? flick : 1), glow: i % 2 ? (i === 1 ? `rgba(${T_RGB},.5)` : `rgba(${O_RGB},.5)`) : 'rgba(255,230,190,.2)', blur: 34 });
    });
    text('为什么，越得不到越上头？', W / 2, 790, { size: 42, weight: 500, align: 'center', ls: 8, color: '#a7b0bf', alpha: sstep(2.8, 3.8, lt) });
    tempLine(1060, T, 120, .8 * sstep(1.5, 3, lt));
  },
});

// ---------------------------------------------------------------- 17.25–36 TA 回了；然后是一周的温度曲线
const VAL = [.92, .84, .12, .04, .96, .2, .58];
const DAYS = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
const CX0 = 170, CX1 = 910, CYB = 1160, CYT = 740;
const dayX = i => CX0 + i * (CX1 - CX0) / 6, valY = v => CYB - v * (CYB - CYT);
function curveAt(u) {                               // Catmull-Rom 插值
  const i = clamp(Math.floor(u), 0, 5), f = u - i, p = k => VAL[clamp(k, 0, 6)];
  const p0 = p(i - 1), p1 = p(i), p2 = p(i + 1), p3 = p(i + 2);
  return clamp(.5 * ((2 * p1) + (-p0 + p2) * f + (2 * p0 - 5 * p1 + 4 * p2 - p3) * f * f + (-p0 + 3 * p1 - 3 * p2 + p3) * f * f * f), -.05, 1.05);
}
const HEAD = [[21.8, 0], [24.8, 1], [26.3, 2], [29.4, 3], [30.6, 4], [33.6, 5], [35.6, 6]];
function headU(t) { if (t <= HEAD[0][0]) return 0; for (let i = 1; i < HEAD.length; i++) if (t < HEAD[i][0]) return lerp(HEAD[i - 1][1], HEAD[i][1], eio((t - HEAD[i - 1][0]) / (HEAD[i][0] - HEAD[i - 1][0]))); return 6; }
shot({
  t0: DROP, t1: 36, fi: .12,
  draw(lt, d, T) {
    const t = DROP + lt;
    floor('#131a26', '#05070a');
    const chatA = 1 - sstep(21.2, 21.8, t);
    if (chatA > 0) {                                  // TA 回了：通知弹下来，心情一下子满了
      ctx.save(); ctx.globalAlpha = chatA;
      chatHeader(1, sstep(17.3, 17.4, t) ? '在线' : '');
      bubble('今天好累', 110, 660, 'L', .45, { time: '20:31' });
      bubble('抱抱，早点休息～', 970, 800, 'R', .45, { time: '20:32' });
      bubble('到家了吗？', 970, 940, 'R', .6, { time: '21:04', tag: '已读', tagA: 1 - sstep(17.6, 18, t) });
      bubble('刚洗完澡，你呢？', 110, 1080, 'L', sstep(17.5, 17.7, t), { time: '00:05', pop: (t - 17.5) / .35 });
      const mood = Math.round(lerp(12, 96, eout((t - 18) / 1.2)));
      callout(540, 1150, 120, 50, sstep(18, 18.4, t), String(mood), '心情', ORANGE, { grow: (t - 18) / .4, bigSize: 72 });
      const by = lerp(260, 640 - 170, eout((t - DROP) / .45)), jx = t - DROP < .5 ? Math.sin((t - DROP) * 90) * 6 * (1 - (t - DROP) / .5) : 0;
      ctx.globalAlpha = chatA * (1 - sstep(19.6, 20.2, t));
      rr(90 + jx, by, 900, 120, 28, 'rgba(36,42,56,.97)', 'rgba(255,255,255,.08)', 2);
      avatar(160 + jx, by + 60, 30);
      text('TA', 220 + jx, by + 42, { font: SANS, weight: 700, size: 32, color: CREAM });
      text('刚洗完澡，你呢？', 220 + jx, by + 84, { font: SANS, size: 30, color: '#c9d0de' });
      text('刚刚', 950 + jx, by + 42, { font: SANS, size: 24, color: DIM, align: 'right' });
      ctx.restore();
    }
    const cA = sstep(21.5, 22, t);
    if (cA > 0) {                                     // 一周的温度：热一天，冷一天
      ctx.save(); ctx.globalAlpha = cA;
      text('TA 的温度', CX0, 612, { font: SANS, size: 28, color: DIM });
      text('热', CX0 - 50, CYT, { size: 30, color: ORANGE, align: 'center' }); text('冷', CX0 - 50, CYB, { size: 30, color: TEAL, align: 'center' });
      ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 10]);
      for (const y of [CYT, (CYT + CYB) / 2, CYB]) { ctx.beginPath(); ctx.moveTo(CX0, y); ctx.lineTo(CX1, y); ctx.stroke(); }
      ctx.setLineDash([]);
      const hu = headU(t);
      DAYS.forEach((s, i) => text(s, dayX(i), 1225, { font: SANS, size: 26, align: 'center', color: i <= hu + .01 ? CREAM : 'rgba(138,147,163,.5)' }));
      ctx.lineWidth = 5; ctx.lineCap = 'round';
      let px = dayX(0), py = valY(curveAt(0));
      for (let u = .02; u <= hu + 1e-6; u += .02) {
        const v = curveAt(u), x = lerp(CX0, CX1, u / 6), y = valY(v), k = clamp(v);

  [59.1, 63.8, '最心动的是「不确定」：因为想得最多。'],
  [64.4, 68.6, '舒尔茨团队在猴子的大脑里发现：'],
  [68.9, 73.2, '奖励一定来、或一定不来，大脑都很平静；'],
  [73.5, 77.8, '可能来、可能不来时，多巴胺的持续信号最强。'],
  [78.3, 82.3, '所以，暧昧比热恋更上头，'],
  [82.6, 86.0, '已读不回，比拒绝更难放下。'],
  [86.3, 89.3, '就像老虎机：下一把，也许就中了。'],
  [98, 103.3, '好的感情，不会让你一直猜。'],
];

const SUB = { x: 96, y: 1420, size: 46, max: 880, lh: 66 };
function subLines(s) {
  const runs = []; let hi = false;
  for (const ch of s) { if (ch === '「') { hi = true; continue; } if (ch === '」') { hi = false; continue; } runs.push({ ch, hi }); }
  ctx.font = `500 ${SUB.size}px ${SERIF}`; ctx.letterSpacing = '2px';
  const width = cs => cs.reduce((w, c) => w + ctx.measureText(c.ch).width + 2, 0);
  if (width(runs) <= SUB.max) return [runs];
  let best = Math.floor(runs.length / 2), bd = 1e9;
  runs.forEach((c, i) => { if ('，、'.includes(c.ch) && Math.abs(i - runs.length / 2) < bd) { bd = Math.abs(i - runs.length / 2); best = i + 1; } });
  return [runs.slice(0, best), runs.slice(best)];
}
function subtitles(T) {
  const g = ctx.createLinearGradient(0, 1240, 0, 1600); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.45, 'rgba(0,0,0,.5)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 1240, W, 360);
  for (const [a0, b0, s] of SUBS) {
    if (T < a0 - .1 || T > b0 + .1) continue;
    const a = win(T, a0, b0, .35, .35); if (a <= 0) continue;
    const lines = subLines(s);
    lines.forEach((ln, i) => {
      let x = SUB.x; const y = SUB.y + (i - (lines.length - 1)) * SUB.lh;
      ctx.font = `500 ${SUB.size}px ${SERIF}`; ctx.letterSpacing = '2px';
      ln.forEach(c => { const w = ctx.measureText(c.ch).width + 2; text(c.ch, x, y, { size: SUB.size, weight: 500, color: c.hi ? ORANGE : CREAM, alpha: a, glow: 'rgba(0,0,0,.9)', blur: 12 }); x += w; });
    });
  }
}

// ======================================================================== 顶部分段进度条
const SECTIONS = [['钩子', 0, DROP], ['共鸣', DROP, 36], ['实验', 36, 64], ['大脑', 64, 78], ['社会现象', 78, CALM], ['结尾', CALM, 110.5]];
const TOTAL = 110.5;
// 进度条放在 TikTok 顶部“关注 / 推荐”栏之下，避免被 App 的界面挡住
const PB = { y: 336, h: 4, x0: 96, x1: 984, gap: 10 };
function progress(T) {
  const span = PB.x1 - PB.x0 - PB.gap * (SECTIONS.length - 1);
  let x = PB.x0, cur = 0;
  SECTIONS.forEach(([name, a, b], i) => {
    const w = span * (b - a) / TOTAL, f = clamp((T - a) / (b - a)); if (T >= a) cur = i;
    rr(x, PB.y, w, PB.h, 2, 'rgba(255,255,255,.16)');
    if (f > 0) { ctx.save(); if (f < 1) { ctx.shadowColor = `rgba(${O_RGB},.9)`; ctx.shadowBlur = 10; } rr(x, PB.y, Math.max(PB.h, w * f), PB.h, 2, f < 1 ? ORANGE : 'rgba(236,230,218,.75)'); ctx.restore(); }
    x += w + PB.gap;
  });
  text(`${String(cur + 1).padStart(2, '0')}  ${SECTIONS[cur][0]}`, PB.x0, PB.y - 32, { size: 28, weight: 500, color: CREAM, alpha: .85, ls: 4 });
  text(`${String(cur + 1).padStart(2, '0')} / ${String(SECTIONS.length).padStart(2, '0')}`, PB.x1, PB.y - 32, { font: LAT, weight: 600, size: 30, color: DIM, align: 'right', ls: 2 });
}

// ======================================================================== 水印
// 低透明度、缓慢漂移；画在场景层里，所以会跟着每个镜头一起淡入淡出。活动范围避开进度条和字幕。
const WM = '@黑猫不说话';
function watermark(T) {
  const x = 540 + Math.sin(T * TAU / 47) * 210 + Math.sin(T * TAU / 83 + 1) * 50;
  const y = 860 + Math.sin(T * TAU / 61 + .7) * 300;
  text(WM, x, y, { font: SANS, weight: 500, size: 30, align: 'center', color: '#ffffff', alpha: .16 * sstep(0, 1.5, T), ls: 2 });
}

// ======================================================================== 帧
const shotAt = T => { let s = SHOTS[0]; for (const S of SHOTS) if (T >= S.t0) s = S; return s; };
function frame(T) {
  T = clamp(T, 0, TOTAL - 1e-3);
  const S = shotAt(T), lt = T - S.t0, d = S.t1 - S.t0;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.letterSpacing = '0px'; ctx.setLineDash([]);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  const z = 1 + .025 * lt / d; ctx.translate(W / 2, H * .5); ctx.scale(z, z); ctx.translate(-W / 2, -H * .5);   // 缓慢推近
  S.draw(lt, d, T);
  watermark(T);
  ctx.restore();
  const dip = 1 - win(lt, 0, d, S.fi ?? .45, S.fo ?? .45);
  if (dip > 0) { ctx.fillStyle = `rgba(0,0,0,${dip})`; ctx.fillRect(0, 0, W, H); }
  post(T); subtitles(T); progress(T);
}

// ======================================================================== 字体、播放与导出接口
let fontsReady = false;
Promise.all([['900', SERIF], ['700', SERIF], ['500', SERIF], ['700', SANS], ['500', SANS], ['italic 500', LAT], ['italic 600', LAT], ['600', LAT]]
  .map(([w, f]) => document.fonts.load(`${w} 40px ${f}`, '忽冷忽热 Aa')))
  .then(() => document.fonts.ready).then(() => { fontsReady = true; frame(0); });
window.__ready = () => fontsReady;
window.__frame = (t, q = .95) => { frame(t); return cv.toDataURL('image/jpeg', q); };
window.__duration = () => TOTAL;
window.__cues = () => ({ total: TOTAL, cues: [], sections: SECTIONS.map(([name, t0, t1]) => ({ name, t0, t1, lines: [] })) });

if (!EXPORT) {
  const au = new Audio('bgm.m4a');
  let playing = false, clock0 = 0, pausedAt = 0, useAudio = true;
  const now = () => useAudio && !au.paused ? au.currentTime : playing ? (performance.now() - clock0) / 1000 : pausedAt;
  function loop() { if (!playing) return; const T = now(); frame(T); if (T >= TOTAL) { playing = false; pausedAt = 0; au.pause(); return; } requestAnimationFrame(loop); }
  function play() { playing = true; clock0 = performance.now() - pausedAt * 1000; au.currentTime = pausedAt; au.play().catch(() => { useAudio = false; }); requestAnimationFrame(loop); }
  function pause() { pausedAt = now(); playing = false; au.pause(); }
  document.getElementById('stage').onclick = () => playing ? pause() : play();
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { const t = clamp(now() + (e.code === 'ArrowRight' ? 5 : -5), 0, TOTAL); pausedAt = t; clock0 = performance.now() - t * 1000; au.currentTime = t; if (!playing) frame(t); }
  });
} else document.getElementById('hint').remove();
</script>
