<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>高敏感人群</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root { --bg: #000; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  canvas { height: 100vh; width: 56.25vh; max-width: 100vw; max-height: 177.78vw; background: #000; display: block; }
  #hint { position: fixed; left: 0; right: 0; bottom: 16px; text-align: center; color: #888; font: 14px "Noto Sans SC", sans-serif; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1080" height="1920"></canvas></div>
<div id="hint">点击播放 / 暂停 · ← → 快退快进</div>
<script>
// 黑猫不说话 · 心理学 No.50《高敏感人群：不是你太敏感，是你感受得更多》
// 电影感引擎（第三季起）：连续镜头、形变转场、逐字浮现的字幕、动态模糊、泛光与胶片颗粒。
// 每一帧仍是时间 T 的纯函数：实时预览与逐帧导出（?export=1）画出的是同一帧。
'use strict';
// ======================================================================== 基础
const W = 1080, H = 1920, FPS = 30, SHUTTER = .5;                 // 180° 快门：每帧曝光半个帧间隔
const EXPORT = /[?&]export=1/.test(location.search);
const cv = document.getElementById('c'), OUT = cv.getContext('2d');
const mk = (w, h) => Object.assign(document.createElement('canvas'), { width: w, height: h });
const LAYER = mk(W, H), LCTX = LAYER.getContext('2d');          // 动态模糊：子帧先画在这里，再平均到 OUT
const BLOOM = mk(W / 4, H / 4), BCTX = BLOOM.getContext('2d');   // 泛光：缩小、提亮部、模糊后叠回去
let ctx = OUT;

const PI = Math.PI, TAU = PI * 2;
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const sstep = (a, b, x) => { const t = prog(x, a, b); return t * t * (3 - 2 * t); };
const win = (t, a, b, fi = .5, fo = .5) => sstep(a, a + fi, t) * (1 - sstep(b - fo, b, t));
const E = {
  lin: t => clamp(t),
  io: t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; },
  out: t => 1 - Math.pow(1 - clamp(t), 3),
  in: t => Math.pow(clamp(t), 3),
  outQuint: t => 1 - Math.pow(1 - clamp(t), 5),
  outExpo: t => (t = clamp(t)) >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => (t = clamp(t)) <= 0 ? 0 : Math.pow(2, 10 * t - 10),
  ioExpo: t => { t = clamp(t); return t <= 0 ? 0 : t >= 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2; },
  ioSine: t => -(Math.cos(PI * clamp(t)) - 1) / 2,
};
// 关键帧轨道：[[t, v, ease?], …]，ease 作用于从这一帧到下一帧的那一段（默认三次缓入缓出）
function track(keys) {
  return T => {
    if (T <= keys[0][0]) return keys[0][1];
    for (let i = 0; i < keys.length - 1; i++) {
      const [a, va, e] = keys[i], [b, vb] = keys[i + 1];
      if (T < b) return lerp(va, vb, (e || E.io)((T - a) / (b - a)));
    }
    return keys[keys.length - 1][1];
  };
}
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash2(i, j) { let h = Math.imul(i, 374761393) + Math.imul(j, 668265263) | 0; h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; }
function vnoise(x, y) {
  const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  return lerp(lerp(hash2(i, j), hash2(i + 1, j), u), lerp(hash2(i, j + 1), hash2(i + 1, j + 1), u), v);
}
function fbm(x, y, o = 4) { let s = 0, a = .5, f = 1, n = 0; for (let k = 0; k < o; k++) { s += a * vnoise(x * f, y * f); n += a; f *= 2.03; a *= .5; } return s / n; }

const SERIF = '"Noto Serif SC", serif', SANS = '"Noto Sans SC", sans-serif', LAT = '"Cormorant Garamond", serif';
const ORANGE = '#f2a14a', TEAL = '#4fd6c4', CREAM = '#ece6da', DIM = '#8a93a3';
const O_RGB = '242,161,74', T_RGB = '79,214,196', C_RGB = '236,230,218';

function reset(c) {
  c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over'; c.filter = 'none';
  c.shadowBlur = 0; c.shadowColor = 'rgba(0,0,0,0)'; c.letterSpacing = '0px'; c.setLineDash([]); c.lineCap = 'butt'; c.lineJoin = 'miter';
}

// ======================================================================== 基础绘制
function font(size, weight = 500, fam = SERIF, style = '') { ctx.font = `${style} ${weight} ${size}px ${fam}`; }
function text(s, x, y, o = {}) {
  if ((o.alpha ?? 1) <= 0) return;
  ctx.save();
  font(o.size || 44, o.weight || 500, o.font || SERIF, o.style || '');
  ctx.textAlign = o.align || 'left'; ctx.textBaseline = o.base || 'middle';
  ctx.globalAlpha *= o.alpha ?? 1; ctx.letterSpacing = (o.ls || 0) + 'px';
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.blur ?? 20; }
  if (o.filter) ctx.filter = o.filter;
  ctx.fillStyle = o.color || CREAM; ctx.fillText(s, x, y);
  ctx.restore();
}
// 发光的点：外圈光晕 + 实心核
function glow(x, y, r, rgb, a = 1, halo = 5) {
  if (a <= 0 || r <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const R = r * halo, g = ctx.createRadialGradient(x, y, 0, x, y, R);
  g.addColorStop(0, `rgba(${rgb},${.55 * a})`); g.addColorStop(.25, `rgba(${rgb},${.18 * a})`); g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, R, 0, TAU); ctx.fill();
  ctx.restore();
  ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = `rgb(${rgb})`; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.restore();
}
function seg(x1, y1, x2, y2, col, lw = 2, a = 1) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore();
}

// ======================================================================== 文字：逐字浮现
// 「」里的字用高亮色
function runs(s) { const r = []; let hi = false; for (const ch of s) { if (ch === '「') { hi = true; continue; } if (ch === '」') { hi = false; continue; } r.push({ ch, hi }); } return r; }
function advances(rs, o) { font(o.size, o.weight || 500, o.font || SERIF, o.style || ''); ctx.letterSpacing = '0px'; return rs.map(c => ctx.measureText(c.ch).width + (o.ls || 0)); }
const runWidth = (rs, o) => advances(rs, o).reduce((a, b) => a + b, 0) - (o.ls || 0);
// p：0 → 1 的出现进度；每个字从模糊、偏下、透明变清晰，前后重叠 spread 个字
function typeRun(rs, x, y, o, p, alpha = 1) {
  if (alpha <= 0 || p <= 0) return;
  const adv = advances(rs, o), total = adv.reduce((a, b) => a + b, 0) - (o.ls || 0);
  let cx = o.align === 'center' ? x - total / 2 : o.align === 'right' ? x - total : x;
  const n = rs.length, sp = o.spread ?? 6;
  ctx.save(); ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.glowBlur ?? 24; }
  for (let i = 0; i < n; i++) {
    const e = E.out(clamp((p * (n + sp) - i) / sp));
    if (e > 0) {
      ctx.globalAlpha = alpha * e;
      const b = (1 - e) * (o.blur ?? 10);
      ctx.filter = b > .4 ? `blur(${b.toFixed(1)}px)` : 'none';
      ctx.fillStyle = rs[i].hi ? (o.hi || ORANGE) : (o.color || CREAM);
      ctx.fillText(rs[i].ch, cx, y + (1 - e) * (o.rise ?? 22));
    }
    cx += adv[i];
  }
  ctx.restore();
}
const typeText = (s, x, y, o, p, alpha) => typeRun(runs(s), x, y, o, p, alpha);

// 断行：放得下就一行；否则两行，优先在标点后断、取最均衡的位置；不拆英文单词和数字
const PUNCT = '，、：；。？！——…';
function wrapRuns(rs, o, max) {
  const wid = a => runWidth(a, o);
  if (wid(rs) <= max) return [rs];
  let best = -1, bd = 1e9;
  rs.forEach((c, i) => {
    if (!PUNCT.includes(c.ch) || i === rs.length - 1) return;
    const a = wid(rs.slice(0, i + 1)), b = wid(rs.slice(i + 1));
    if (a <= max && b <= max && Math.abs(a - b) < bd) { bd = Math.abs(a - b); best = i + 1; }
  });
  if (best < 0) rs.forEach((c, i) => {
    if (i === 0 || PUNCT.includes(c.ch) || /\w\w/.test(rs[i - 1].ch + c.ch)) return;
    const a = wid(rs.slice(0, i)), b = wid(rs.slice(i));
    if (a <= max && b <= max && Math.abs(a - b) < bd) { bd = Math.abs(a - b); best = i; }
  });
  return best > 0 ? [rs.slice(0, best), rs.slice(best)] : [rs];
}

// ======================================================================== 字幕（无配音，字幕就是旁白）
// 左下角衬线字，逐字浮现；离场时轻轻上浮淡出。位置避开 TikTok 底部文案和右侧按钮。
const NARR = { x: 96, y: 1436, lh: 68, max: 880, size: 46, weight: 500, font: SERIF, ls: 2, spread: 7, rise: 14, blur: 8 };
const WRAP_CACHE = new Map();
function narration(T) {
  let shade = 0;
  for (const [a, b] of LINES) shade = Math.max(shade, win(T, a - .4, b + .6, .5, .6));
  if (shade > 0) {
    const g = ctx.createLinearGradient(0, 1250, 0, 1620); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.5, `rgba(0,0,0,${.42 * shade})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 1250, W, 370);
  }
  LINES.forEach(([a, b, s], k) => {
    const next = LINES[k + 1] ? LINES[k + 1][0] : Infinity, fe = Math.max(b + .15, Math.min(b + .6, next - .05));   // 下一句开始之前淡出完，两句不叠在一起
    if (T < a || T > fe + .1) return;
    if (!WRAP_CACHE.has(s)) WRAP_CACHE.set(s, wrapRuns(runs(s), NARR, NARR.max));
    const lines = WRAP_CACHE.get(s);
    const fade = 1 - sstep(b, fe, T), drift = -16 * E.in(prog(T, b, fe + .1));
    const n = lines.reduce((k, l) => k + l.length, 0), dur = Math.min(1.2, .3 + n * .03);
    lines.forEach((ln, i) => {
      const t0 = a + i * .22;
      typeRun(ln, NARR.x, NARR.y + (i - (lines.length - 1)) * NARR.lh + drift, { ...NARR, glow: 'rgba(0,0,0,.9)', glowBlur: 14 }, prog(T, t0, t0 + dur), fade);
    });
  });
}

// ======================================================================== 右上角的年份 / 出处
function stamp(s, sub, t0, t1, T) {
  const a = win(T, t0, t1, .7, .7); if (a <= 0) return;
  const e = E.outExpo(prog(T, t0, t0 + 1.4));
  text(s, W - 96 + (1 - e) * 40, 412, { font: LAT, weight: 600, size: 56, align: 'right', alpha: a * .95, ls: 4 });
  if (sub) text(sub, W - 96 + (1 - e) * 70, 462, { font: LAT, style: 'italic', weight: 500, size: 29, align: 'right', color: DIM, alpha: a });
}

// ======================================================================== 顶部分段进度条
// 放在 TikTok 顶部“关注 / 推荐”栏之下（y = 336）。当前段落橙色，头部带一颗发光的点；段落名切换时上下交替。
const PB = { y: 336, x0: 96, x1: 984, gap: 12 };
function progress(T, a = 1) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a;
  const span = PB.x1 - PB.x0 - PB.gap * (SECTIONS.length - 1);
  let x = PB.x0, cur = 0;
  SECTIONS.forEach(([, s0, s1], i) => {
    const w = span * (s1 - s0) / TOTAL, f = clamp((T - s0) / (s1 - s0)); if (T >= s0) cur = i;
    ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fillRect(x, PB.y - 1, w, 2);
    if (f > 0) {
      ctx.fillStyle = f < 1 ? ORANGE : 'rgba(236,230,218,.7)'; ctx.fillRect(x, PB.y - 1, w * f, 2);
      if (f < 1) glow(x + w * f, PB.y, 3.2, O_RGB, 1, 5);
    }
    x += w + PB.gap;
  });
  SECTIONS.forEach(([name, s0], i) => {
    const s1 = SECTIONS[i + 1] ? SECTIONS[i + 1][1] : TOTAL + 9;
    const k = (i ? sstep(s0, s0 + .45, T) : 1) * (1 - sstep(s1 - .45, s1, T)); if (k <= 0) return;
    const e = i ? sstep(s0, s0 + .45, T) : 1, y = PB.y - 34 + (1 - e) * 10 - 10 * sstep(s1 - .45, s1, T);
    text(`${String(i + 1).padStart(2, '0')}   ${name}`, PB.x0, y, { size: 27, weight: 500, color: CREAM, alpha: .88 * k, ls: 4 });
  });
  text(`${String(cur + 1).padStart(2, '0')} / ${String(SECTIONS.length).padStart(2, '0')}`, PB.x1, PB.y - 34, { font: LAT, weight: 600, size: 30, color: DIM, align: 'right', ls: 2 });
  ctx.restore();
}

// ======================================================================== 水印
// 低透明度、缓慢漂移，活动范围避开进度条和字幕
const WM = '@黑猫不说话';
function watermark(T, a = 1) {
  const x = 540 + Math.sin(T * TAU / 47 + 1.1) * 210 + Math.sin(T * TAU / 83 + 1) * 50;
  const y = 860 + Math.sin(T * TAU / 61 + 1.3) * 300;
  text(WM, x, y, { font: SANS, weight: 500, size: 30, align: 'center', color: '#ffffff', alpha: .16 * a, ls: 2 });
}

// ======================================================================== 后期：泛光、暗角、颗粒
const GRAIN = (() => {
  const c = mk(256, 256), g = c.getContext('2d'), im = g.createImageData(256, 256), r = mulberry(3);
  for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0); return c;
})();
function bloom(k) {
  if (k <= 0) return;
  reset(BCTX); BCTX.globalCompositeOperation = 'copy'; BCTX.filter = 'brightness(.9) contrast(2.4) blur(5px)';
  BCTX.drawImage(cv, 0, 0, W / 4, H / 4);
  OUT.save(); OUT.globalCompositeOperation = 'screen'; OUT.globalAlpha = k; OUT.imageSmoothingQuality = 'high'; OUT.drawImage(BLOOM, 0, 0, W, H); OUT.restore();
}
function grade(T, vig = .62, grain = .07) {
  const v = ctx.createRadialGradient(W / 2, H * .46, H * .26, W / 2, H * .46, H * .82);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, `rgba(0,0,0,${vig})`); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  const f = Math.floor(T * FPS), ox = (f * 97) % 256, oy = (f * 61) % 256;
  ctx.save(); ctx.globalAlpha = grain; ctx.globalCompositeOperation = 'overlay';
  ctx.fillStyle = ctx.createPattern(GRAIN, 'repeat'); ctx.translate(-ox, -oy); ctx.fillRect(0, 0, W + 256, H + 256); ctx.restore();
}

// ======================================================================== 一帧
// 剧集提供：TOTAL、SECTIONS、LINES、CUES、INIT()、WORLD(t)、SAMPLES(T)、OVER(T)、MASTER(T)
function render(T) {
  T = clamp(T, 0, TOTAL - 1e-4);
  const n = Math.max(1, SAMPLES(T) | 0);
  reset(OUT);
  for (let k = 0; k < n; k++) {
    const t = n === 1 ? T : T + (k / (n - 1) - .5) * SHUTTER / FPS;
    ctx = n === 1 ? OUT : LCTX; reset(ctx); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    WORLD(t);
    if (n > 1) { reset(OUT); OUT.globalAlpha = 1 / (k + 1); OUT.drawImage(LAYER, 0, 0); }
  }
  ctx = OUT; reset(OUT);
  bloom(BLOOM_K(T)); reset(OUT);
  grade(T); reset(OUT);
  OVER(T); reset(OUT);
  narration(T); reset(OUT);
  const m = MASTER(T);
  watermark(T, m); if (SHOW_PROGRESS) progress(T, m); reset(OUT);
  const dark = sstep(TOTAL - .9, TOTAL, T);                         // 第一帧就是封面，不做淡入；结尾淡出接片尾
  if (dark > 0) { OUT.fillStyle = `rgba(0,0,0,${dark})`; OUT.fillRect(0, 0, W, H); }
}

const SHOW_PROGRESS = false;
// ======================================================================== No.50 高敏感人群：不是你太敏感，是你感受得更多（Wojak 版）
// 和 talk06 同一个故事、同一套台词和配音，只是角色从黑猫换成了 Wojak（频道主给的形象，在 ../characters/）：
//   小黑 = 主人公（戴猫耳帽、肩上趴着黑猫，characters/hero/expr/ 里 8 个表情，随台词换）；
//   老哥 = 同事-老哥（原来的阿橘）；学姐 = 女同事-行政；老板 = 领导-上司（这一版露脸了）。
// 画面：真实照片放在竖屏中间的画框里（y 470–1430），人物是半身像，站在照片前面、贴着画框底边；
// 对话框统一在画框上部；讲知识的小图示画在压暗的画框中下部，和对话框错开。封面钩子和标题在画框上面的黑边里。
// 没有片头（"intro": false），没有进度条（"progress": false）；片尾和水印保留。
// ======================================================================== 时间轴（layout.py 生成，别手改）
const TOTAL = 150.4;
const SECTIONS = [['早上', 0.0, 16.0], ['公司', 16.0, 32.0], ['晚上', 32.0, 41.6], ['是什么', 41.6, 89.6], ['怎么来的', 89.6, 112.0], ['怎么办', 112.0, 131.2], ['第二天', 131.2, 150.4]];
const LINES = [];                                                   // 没有旁白
const DIALOG = [
  [0.30, 8.08, '好吵……喇叭声、脚步声、有人在打电话，全挤进我脑子里了。', '黑', 'think'],
  [8.48, 10.15, '快点快点，绿灯了！', '橘', 'say'],
  [10.40, 12.58, '你不觉得……这里太吵了吗？', '黑', 'say'],
  [12.78, 14.22, '有吗？还好吧。', '橘', 'say'],
  [16.40, 17.90, '嗯……先这样吧。', '板', 'say'],
  [18.40, 21.96, '他刚才是不是叹气了？是不是我做得不好？', '黑', 'think'],
  [22.36, 24.32, '你怎么了？脸色这么差。', '橘', 'say'],
  [24.52, 27.54, '老板刚才那句话，语气好像不太对。', '黑', 'say'],
  [27.84, 30.34, '你想太多了吧。你就是太敏感了。', '橘', 'say'],
  [32.40, 35.37, '一整天的每一句话，都在脑子里重播。', '黑', 'think'],
  [35.97, 38.22, '我是不是……太脆弱了？', '黑', 'think'],
  [42.00, 43.22, '又在想白天的事？', '姐', 'say'],
  [43.47, 46.24, '嗯。大家都说我太敏感了。', '黑', 'say'],
  [46.59, 53.02, '敏感不是毛病。心理学家专门研究过像你这样的人，叫「高敏感人群」。', '姐', 'say'],
  [53.27, 54.01, '高敏感？', '黑', 'say'],
  [54.21, 58.50, '有研究估计，差不多每五个人里，就有一个是这样的。', '姐', 'say'],
  [58.85, 62.03, '你们的大脑，处理信息更深、更细。', '姐', 'say'],
  [62.23, 67.87, '别人没注意的声音、光线、一个小眼神，你都接收到了，还会反复琢磨。', '姐', 'say'],
  [68.17, 71.37, '所以我在人多的地方，特别容易累？', '黑', 'say'],

    if (ov > 0) { const fill = E.io(prog(t, D(19) + .8, D(19) + 3.4)), bx = hx + 250, by = hy + 120, bh = 280;
      ctx.save(); ctx.globalAlpha = ov; ctx.fillStyle = 'rgba(14,16,22,.85)'; ctx.strokeStyle = CREAM; ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect(bx - 26, by - bh, 52, bh, 12); ctx.fill(); ctx.stroke();
      ctx.fillStyle = fill > .8 ? RED : mixc('#7fe3d3', '#ffb36b', fill / .8); ctx.beginPath(); ctx.roundRect(bx - 19, by - 7 - (bh - 14) * fill, 38, (bh - 14) * fill, 8); ctx.fill(); ctx.restore();
      text('过载', bx, by - bh - 34, { font: SANS, size: 36, weight: 900, align: 'center', color: fill > .8 ? '#ff8f8f' : CREAM, alpha: ov * sstep(.7, .85, fill), glow: 'rgba(0,0,0,.9)', blur: 12 }); }
  }
  // 脑成像：跟共情有关的脑区更活跃
  const br = win(t, D(20) + 2.6, D(21) + .3, .3, .4);
  if (br > 0) { dimFrame(br, .86); const cx = 540, cy = 960, p = .5 + .5 * Math.sin(t * 6);
    ctx.save(); ctx.globalAlpha = br; ctx.fillStyle = 'rgba(14,16,22,.85)'; ctx.strokeStyle = 'rgba(236,230,218,.8)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(cx, cy, 150, 105, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, cy - 100); ctx.bezierCurveTo(cx - 18, cy - 36, cx + 18, cy + 25, cx, cy + 100); ctx.stroke(); ctx.restore();
    for (const [dx, dy] of [[-65, 12], [60, -8], [-25, -48], [35, 50]]) glow(cx + dx, cy + dy, 11 + 5 * p, '255,150,120', br, 7);
    text('共情相关的脑区：更活跃', cx, cy + 160, { font: SANS, size: 36, weight: 900, align: 'center', color: '#ffb59a', alpha: br }); }
  // 双胞胎：差不多一半和基因有关
  const tw = win(t, D(23) + 1.0, D(24) + .3, .3, .4);
  if (tw > 0) { dimFrame(tw, .94);
    text('双胞胎研究', 540, 770, { font: SANS, size: 36, weight: 700, align: 'center', color: DIM, alpha: tw });
    bust('眼镜男', 410, 1090, 300, tw); bust('眼镜男', 670, 1090, 300, tw);
    const g = E.io(prog(t, D(23) + 2.6, D(23) + 4.2)), y0 = 1120, x0 = 180, x1 = 900;
    ctx.save(); ctx.globalAlpha = tw; ctx.fillStyle = 'rgba(236,230,218,.18)'; ctx.fillRect(x0, y0, x1 - x0, 34);
    ctx.fillStyle = GOLD; ctx.fillRect(x0, y0, (x1 - x0) * .47 * g, 34); ctx.restore();
    text('基因 ≈ 47%', x0, y0 + 76, { font: SANS, size: 38, weight: 900, color: GOLD, alpha: tw * sstep(.6, 1, g) });
    text('环境 ≈ 53%', x1, y0 + 76, { font: SANS, size: 38, weight: 900, align: 'right', color: CREAM, alpha: tw * sstep(.6, 1, g) }); }
  // 不是病，也不是矫情：是天生的特质
  const tr = win(t, D(24) + .6, D(25) + .2, .3, .4);
  if (tr > 0) { dimFrame(tr, .92);
    [['病', D(24) + 2.0, 360, 920], ['矫情', D(24) + 2.8, 720, 920]].forEach(([s, t0, x, y]) => { const k = sstep(t0, t0 + .25, t) * tr; pill(s, x, y, k, { size: 44, color: CREAM });
      if (t > t0 + .2) seg(x - 90, y, x - 90 + 180 * E.out(prog(t, t0 + .2, t0 + .45)), y, RED, 7, tr); });
    pill('天生的特质', 540, 1110, tr * sstep(D(24) + .6, D(24) + 1.0, t), { size: 52, color: '#1a1208', fill: 'rgba(255,210,150,.95)', stroke: 'rgba(0,0,0,0)', glow: `rgba(${O_RGB},.6)` }); }
  // 糟糕的环境 / 好的环境：同一个主人公，左边难过，右边开心
  const ev = win(t, D(25) + 2.0, D(26) + .2, .4, .4);
  if (ev > 0) {
    dimFrame(.75 * ev); ctx.save(); ctx.globalAlpha = ev; ctx.fillStyle = 'rgba(10,12,18,.72)'; ctx.fillRect(FR.x, FR.y, FR.w / 2, FR.h);
    const g2 = ctx.createLinearGradient(540, 0, 1080, 0); g2.addColorStop(0, 'rgba(255,200,120,.18)'); g2.addColorStop(1, 'rgba(255,220,150,.36)'); ctx.fillStyle = g2; ctx.fillRect(540, FR.y, 540, FR.h); ctx.restore();
    seg(540, FR.y + 260, 540, FR.y + FR.h - 40, 'rgba(236,230,218,.4)', 2, ev);
    const bad = sstep(D(25) + 2.4, D(25) + 2.8, t) * ev, good = sstep(D(25) + 5.0, D(25) + 5.4, t) * ev;
    ctx.save(); ctx.beginPath(); ctx.rect(FR.x, FR.y, FR.w, FR.h); ctx.clip();
    bust('hero_sad', 270, FB, 470, bad, 'brightness(.62) saturate(.3)');
    for (let i = 0; i < 46; i++) { const r = mulberry(70 + i), x = 20 + r() * 500, y = FR.y + ((t * (300 + 200 * r()) + r() * FR.h) % FR.h);
      seg(x, y, x - 4, y + 18, 'rgba(180,200,230,.55)', 1.5, bad); }
    warmth(.8 * good, 810, 1150, 420); bust('hero_happy', 810, FB, 470, good);
    ctx.restore();
    text('糟糕的环境', 270, 790, { font: SANS, size: 42, weight: 900, align: 'center', color: V_LT, alpha: bad, glow: 'rgba(0,0,0,.9)', blur: 12 }); text('更容易受伤', 270, 846, { font: SANS, size: 34, weight: 700, align: 'center', color: CREAM, alpha: bad, glow: 'rgba(0,0,0,.9)', blur: 12 });
    text('好的环境', 810, 790, { font: SANS, size: 42, weight: 900, align: 'center', color: GOLD, alpha: good, glow: 'rgba(0,0,0,.9)', blur: 12 }); text('收获也更多', 810, 846, { font: SANS, size: 34, weight: 700, align: 'center', color: CREAM, alpha: good, glow: 'rgba(0,0,0,.9)', blur: 12 });
  }
  // 安静的角落：充电
  if (me) {
    const bt = win(t, D(27) + 3.0, D(28) + .3, .3, .4);
    if (bt > 0) { const [hx, hy] = me.face, fill = E.io(prog(t, D(27) + 3.2, D(27) + 5.0)), bx = hx + 230, by = hy - 150;
      ctx.save(); ctx.globalAlpha = bt; ctx.strokeStyle = CREAM; ctx.lineWidth = 4; ctx.fillStyle = 'rgba(14,16,22,.85)'; ctx.beginPath(); ctx.roundRect(bx - 75, by - 36, 150, 72, 12); ctx.fill(); ctx.stroke();
      ctx.fillStyle = CREAM; ctx.fillRect(bx + 77, by - 13, 10, 26); ctx.fillStyle = '#7fe3a0'; ctx.fillRect(bx - 67, by - 28, 134 * (.2 + .8 * fill), 56); ctx.restore();
      text('充电中', bx, by - 70, { font: SANS, size: 32, weight: 900, align: 'center', color: '#a9f0c0', alpha: bt, glow: 'rgba(0,0,0,.9)', blur: 12 }); }
  }

  const cal = win(t, D(28) + .4, D(29) - .4, .3, .3);
  if (cal > 0) { dimFrame(.6 * cal);
    [['上班', 0, 0], ['休息', 1, 1], ['聚餐', 2, 0], ['休息', 3, 1], ['见朋友', 4, 0]].forEach(([s, i, rest]) => {
      const k = sstep(D(28) + .5 + i * .35, D(28) + .8 + i * .35, t) * cal, x = 150 + i * 195;
      pill(s, x, 1300, k, rest ? { size: 34, color: '#0e2a1b', fill: 'rgba(127,227,160,.95)', stroke: 'rgba(0,0,0,0)', glow: 'rgba(127,227,160,.6)' } : { size: 34, color: CREAM }); }); }
}

// ======================================================================== 世界层
function WORLD(t) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  let info = null;
  SHOTS.forEach((sh, i) => {
    if (t < sh.t0 - XF / 2 || t > sh.t1 + XF / 2) return;
    const a = i === 0 ? 1 : sstep(sh.t0 - XF / 2, sh.t0 + XF / 2, t);
    const r = drawShot(sh, t, a); if (r && a > .5) info = r;
  });
  ctx.save(); ctx.strokeStyle = 'rgba(236,230,218,.12)'; ctx.lineWidth = 2; ctx.strokeRect(FR.x - 1, FR.y - 1, FR.w + 2, FR.h + 2); ctx.restore();
  // 太吵：街上的声音挤进来（画框中下部，压在人身上）
  [['嘀——！', D(0) + 2.0, 250, 860], ['喂？你听得到吗？', D(0) + 2.5, 780, 820], ['让一让！', D(0) + 3.0, 260, 1060], ['嘟嘟嘟嘟', D(0) + 3.5, 820, 1080], ['叮咚', D(0) + 4.0, 540, 1200], ['到底什么时候到？', D(0) + 4.5, 620, 960]].forEach(([s, t0, x, y], i) => {
    const k = sstep(t0, t0 + .2, t) * (1 - sstep(D(1) + .2, D(1) + .7, t)); if (k <= 0) return;
    const j = Math.sin(t * 40 + i) * 3;
    text(s, x + j, y, { font: SANS, size: 42 + (i % 3) * 6, weight: 900, align: 'center', color: i % 2 ? '#ffd2a0' : '#ffffff', alpha: k * (.8 + .2 * Math.sin(t * 9 + i)), glow: 'rgba(0,0,0,.95)', blur: 16 });
  });
  overlays(t, info);
  // 晚上：白天的话在脑子里重播（主人公两边）
  [['你就是太敏感了。', D(9) + .3, 210, 830], ['嗯……先这样吧。', D(9) + 1.1, 880, 900], ['有吗？还好吧。', D(9) + 1.9, 200, 1080], ['脸色这么差。', D(9) + 2.6, 890, 1150]].forEach(([s, t0, x, y], i) => {
    const k = sstep(t0, t0 + .6, t) * (1 - sstep(S['是什么'] - 1.0, S['是什么'] - .2, t)); if (k <= 0) return;
    text(s, x + Math.sin(t * .7 + i) * 16, y - (t - t0) * 6, { font: SANS, size: 36, weight: 700, align: 'center', color: 'rgba(236,230,218,.95)', alpha: k * (.45 + .25 * Math.sin(t * 1.3 + i * 2)), filter: 'blur(1px)', glow: 'rgba(0,0,0,.9)', blur: 10 });
  });
  // 对话框：每一句在它说的时候出现，说完淡出
  DIALOG.forEach(([a, b, s, who, kind], i) => {
    const next = DIALOG[i + 1] ? DIALOG[i + 1][0] : TOTAL, fe = Math.max(b + .25, Math.min(b + .7, next - .05));
    if (t < a - .1 || t > fe + .05) return;
    const k = sstep(a - .1, a + .15, t) * (1 - sstep(fe - .25, fe, t));
    const m = info && info.cast.find(c => c.who === who);
    if (m) bubble(s, kind, m.top[0], m.top[1], k);
    else bubble(s, kind, 860, FR.y + 400, k, { name: CAST[who].name, noTail: true });
  });
  // 画框上面的黑边：第一帧是封面钩子；之后换成标题
  const hook = 1 - sstep(S['公司'] - .8, S['公司'] - .1, t), ttl = sstep(S['公司'] - .3, S['公司'] + .5, t);
  text('人一多就累，', 540, 268, { size: 78, weight: 900, align: 'center', color: CREAM, alpha: hook });
  text('一句话能想一整天', 540, 378, { size: 78, weight: 900, align: 'center', color: GOLD, alpha: hook });
  text('高敏感人群', 540, 300, { font: SERIF, size: 60, weight: 900, align: 'center', color: GOLD, alpha: ttl });
  text('不是你太敏感，是你感受得更多', 540, 376, { font: SANS, size: 34, weight: 700, align: 'center', color: CREAM, alpha: ttl * .85 });
  // 最后的字卡（画框下面）
  const c1 = win(t, CARDS_AT, CARDS_AT + 4.0, .4, .4), c2 = sstep(CARDS_AT + 3.8, CARDS_AT + 4.3, t);
  typeText('不是你太敏感，', 540, 1530, { ...big, size: 60, weight: 900, color: CREAM }, prog(t, CARDS_AT, CARDS_AT + .8), c1);
  typeText('是你感受得更多。', 540, 1630, { ...big, size: 72, weight: 900, color: GOLD, glow: `rgba(${O_RGB},.5)`, glowBlur: 26 }, prog(t, CARDS_AT + 1.0, CARDS_AT + 2.0), c1);
  typeText('评论区说说：', 540, 1530, { size: 44, weight: 700, font: SERIF, align: 'center', color: CREAM, spread: 4 }, prog(t, CARDS_AT + 3.9, CARDS_AT + 4.4), c2);
  typeText('你是高敏感的人吗？', 540, 1620, { size: 60, weight: 900, font: SERIF, align: 'center', color: GOLD, spread: 5, glow: `rgba(${O_RGB},.4)`, glowBlur: 16 }, prog(t, CARDS_AT + 4.3, CARDS_AT + 5.3), c2);
}
function SAMPLES(T) { return SHOTS.some((sh, i) => i && Math.abs(T - sh.t0) < XF / 2 + .05) ? 4 : 2; }
function BLOOM_K(T) { return .25; }
function OVER(T) {
  stamp('1997', 'Aron & Aron', D(13) + 3.6, D(16), T);
  stamp('2014', 'Acevedo 等', D(20), D(21) + .3, T);
  stamp('2021', 'Assary 等', D(23), D(24) + .3, T);
  stamp('2009', 'Belsky & Pluess', D(25), D(26) + .2, T);
}
function MASTER(T) { return 1; }
function INIT() {
  const sec = n => S[n];
  // 一场戏一张图：街上、公司、卧室、客厅（学姐整场对话）、公园（第二天到结尾）。取景基本不动，只有很慢的一点推近
  SHOTS = [
    { name: 'street', img: 'street', t0: 0, t1: sec('公司'), a: [100, 700, 1300], b: [140, 720, 1250] },
    { name: 'office', img: 'office', t0: sec('公司'), t1: sec('晚上'), a: [0, 700, 1333], b: [40, 720, 1280] },
    { name: 'bedroom_dark', img: 'bedroom_dark', t0: sec('晚上'), t1: sec('是什么'), a: [200, 760, 1100], b: [230, 780, 1060] },
    { name: 'livingroom', img: 'livingroom', enter: true, t0: sec('是什么'), t1: sec('第二天'), a: [130, 760, 1400], b: [180, 790, 1340] },
    { name: 'park_fog', img: 'park_fog', t0: sec('第二天'), t1: TOTAL + 1, a: [60, 560, 1250], b: [100, 590, 1200] },
  ];
}

// ======================================================================== 音效提示表
function CUES() {
  const c = [];
  // ① 街上：人声车声；绿灯“嘀嘀”；老哥催
  c.push([0, 'crowd', { dur: S['公司'] + .5, gain: .16, fi: .05, fo: .6 }]);
  for (const t0 of [D(0) + .5, D(0) + 2.6]) c.push([t0, 'honk', { gain: .07 }]);
  for (let i = 0; i < 6; i++) c.push([D(1) - .3 + i * .5, 'tick', { gain: .05 }]);
  // ② 公司：键盘声；老板那句之后的安静；心里一沉
  for (let i = 0; i < 10; i++) c.push([S['公司'] + .3 + i * .17 + (i % 3) * .05, 'click', { gain: .025 }]);
  c.push([D(5) + .2, 'air', { dur: 2.6, hum: 98, gain: .05 }]);
  // ③ 晚上：钟表滴答；白天的话在脑子里回响
  for (let i = 0; i < 12; i++) c.push([S['晚上'] + .2 + i * .8, 'tick', { gain: .03 }]);
  c.push([D(9) + .3, 'revcym', { dur: 2.0, gain: .05 }]);
  // ④–⑥ 学姐：进门；图示一个个亮起来
  c.push([S['是什么'] + .2, 'swish', { dur: .8, gain: .04 }]);
  c.push([D(13) + 3.6, 'shimmer', { f: [784, 988, 1175, 1568], gain: .08 }], [D(15) + 2.6, 'tink', { f: 1175, gain: .05 }]);
  for (const t0 of [D(17) + 1.0, D(17) + 1.9, D(17) + 2.9]) c.push([t0, 'tink', { f: 1318.5, gain: .04 }]);
  c.push([D(19) + .8, 'bar', { f0: 300, f1: 900, dur: 2.6, gain: .04 }], [D(20) + 2.6, 'swell', { dur: 1.6, f: [146.8, 220, 293.7, 370], gain: .05 }]);
  c.push([D(23) + 2.6, 'bar', { f0: 300, f1: 600, dur: 1.6, gain: .04 }], [D(24) + 2.2, 'swish', { dur: .3, gain: .05 }], [D(24) + 3.0, 'swish', { dur: .3, gain: .05 }]);
  c.push([D(25) + 2.4, 'rain', { dur: 3.0, gain: .06, muffle: 1, fi: .3, fo: .6 }], [D(25) + 5.0, 'shimmer', { f: [587.3, 740, 880, 1175], gain: .06 }]);
  c.push([D(27) + 3.2, 'bar', { f0: 400, f1: 800, dur: 1.8, gain: .035 }]);
  for (let i = 0; i < 5; i++) c.push([D(28) + .5 + i * .35, 'tick', { gain: .03 }]);
  // ⑦ 清晨的公园：鸟叫
  c.push([S['第二天'] - .3, 'birds', { dur: TOTAL - S['第二天'] + .3, gain: .1 }], [CARDS_AT, 'shimmer', { f: [587.3, 740, 880, 1175, 1480], gain: .1 }]);
  return c.sort((a, b) => a[0] - b[0]);
}

// ======================================================================== 字体、播放与导出接口
let fontsReady = false;
Promise.all([['900', SERIF], ['700', SERIF], ['500', SERIF], ['700', SANS], ['500', SANS], ['italic 500', LAT], ['italic 600', LAT], ['600', LAT]]
  .map(([w, f]) => document.fonts.load(`${w} 40px ${f}`, '高敏感人群 Aa')))
  .then(() => document.fonts.ready).then(() => { INIT(); fontsReady = true; render(0); });
window.__ready = () => fontsReady && (typeof ASSETS_READY !== 'function' || ASSETS_READY());   // 照片这类素材（No.50 起）也要加载完
window.__frame = (t, q = .95) => { render(t); return cv.toDataURL('image/jpeg', q); };
window.__duration = () => TOTAL;
window.__cues = () => ({ total: TOTAL, cues: typeof CUES === 'function' ? CUES() : CUES, sections: SECTIONS.map(([name, t0, t1]) => ({ name, t0, t1 })) });

if (!EXPORT) {
  const au = new Audio('audio.wav');
  let playing = false, clock0 = 0, pausedAt = 0, useAudio = true;
  const now = () => useAudio && !au.paused ? au.currentTime : playing ? (performance.now() - clock0) / 1000 : pausedAt;
  function loop() { if (!playing) return; const T = now(); render(T); if (T >= TOTAL) { playing = false; pausedAt = 0; au.pause(); return; } requestAnimationFrame(loop); }
  function play() { playing = true; clock0 = performance.now() - pausedAt * 1000; au.currentTime = pausedAt; au.play().catch(() => { useAudio = false; }); requestAnimationFrame(loop); }
  function pause() { pausedAt = now(); playing = false; au.pause(); }
  document.getElementById('stage').onclick = () => playing ? pause() : play();
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { const t = clamp(now() + (e.code === 'ArrowRight' ? 5 : -5), 0, TOTAL); pausedAt = t; clock0 = performance.now() - t * 1000; au.currentTime = t; if (!playing) render(t); }
  });
} else document.getElementById('hint').remove();
